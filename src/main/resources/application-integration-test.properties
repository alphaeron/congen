# Integration Test Profile Configuration
# Inherit all settings from application-test.properties

# Disable Spring and JUnit parallel test execution
spring.test.context.parallel.enabled=false
junit.jupiter.execution.parallel.enabled=false

# Liquibase Configuration for Tests
# Ensure database migrations run to populate initial data
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:migrations/changelog-root.xml
spring.liquibase.contexts=test