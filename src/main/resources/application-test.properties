# Test Profile Configuration
# This profile is used for integration tests that require a real database connection

# Test PostgreSQL Configuration
congen.postgres.writer.host=localhost
congen.postgres.reader.host=localhost
congen.postgres.port=5432
congen.postgres.username=postgres
congen.postgres.password=postgres
congen.postgres.db-name=postgres
congen.postgres.ssl-mode=false

# Test CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Content-Type,Authorization,X-Requested-With
cors.exposed-headers=Content-Type,Content-Range
cors.max-age=86400

# Disable security headers for testing
spring.security.enabled=false 