apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: congen

build:
  artifacts:
  - image: congen
    jib: {}
  local:
    push: false

deploy:
  kubectl:
    flags:
      global:
      - --namespace=congen
    manifests:
      - k8s/overlays/local

portForward:
- resourceType: service
  resourceName: frontend
  port: 80
  localPort: 3000
- resourceType: service
  resourceName: congen
  port: 8888
  localPort: 8888
- resourceType: service
  resourceName: keycloak
  port: 8080
  localPort: 8080
- resourceType: service
  resourceName: postgres
  port: 5432
  localPort: 5432 