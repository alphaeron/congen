// Deployment configuration for keycloak-account-theme

// Update Kubernetes ConfigMap with theme JAR
task updateK8sConfigMap(type: Exec) {
    group = 'deployment'
    description = 'Update Kubernetes ConfigMap with theme JAR'
    dependsOn buildKeycloakTheme
    
    commandLine './scripts/update-k8s-configmap.sh'
    workingDir projectDir
    
    doLast {
        println "✅ Kubernetes ConfigMap updated with theme JAR"
        println "🚀 Ready for deployment with: './gradlew deployment'"
    }
}

// Copy theme files to Kubernetes configmap directory
task copyThemeToK8s(type: Copy) {
    group = 'deployment'
    description = 'Copy theme JAR to Kubernetes ConfigMap directory'
    dependsOn updateK8sConfigMap

    from 'dist_keycloak/congen-account-theme.jar'
    into "${rootProject.projectDir}/k8s/base/stage-6/keycloak-theme/"
    
    doFirst {
        // Create the directory if it doesn't exist
        file("${rootProject.projectDir}/k8s/base/stage-6/keycloak-theme/").mkdirs()
    }
    
    doLast {
        println "✅ Copied theme JAR to k8s/base/stage-6/keycloak-theme/"
    }
}

// Ensure the theme is updated when building
tasks.named('build').configure {
    finalizedBy copyThemeToK8s
}