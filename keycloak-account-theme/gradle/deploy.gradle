// Deployment configuration for keycloak-account-theme

// Prepare deployment by building Docker image for theme JAR
task prepareDeployment {
    group = 'deployment'
    description = 'Prepare deployment by building Docker image containing theme JAR'
    dependsOn buildKeycloakTheme
    
    doLast {
        // Build the Docker image
        exec {
            commandLine 'docker', 'build', '-t', 'keycloak-theme:latest', '.'
            workingDir projectDir
        }
        println "✅ Docker image built: keycloak-theme:latest"
        
        // If environment is local, load image into minikube
        if (project.environment == 'local') {
            println "🔄 Loading image into minikube for local environment..."
            exec {
                commandLine 'minikube', 'image', 'load', 'keycloak-theme:latest'
            }
            println "✅ Image loaded into minikube"
        }
        
        println "🚀 Ready for deployment with: './gradlew deployment'"
    }
}