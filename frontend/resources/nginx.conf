# Production-ready nginx configuration
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

# Error and access logging
error_log /var/log/nginx/error.log warn;

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging format for production
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;

  # Security settings
  server_tokens off;
  
  # Real IP configuration for production load balancers
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 169.254.0.0/16;
  real_ip_recursive on;
  real_ip_header X-Forwarded-For;

  # Rate limiting - production settings
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;
  limit_req_status 429;

  # Connection limits
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_conn_status 503;

  # Performance optimizations
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  client_max_body_size 64M;
  client_body_timeout 60s;
  client_header_timeout 60s;
  send_timeout 60s;

  # Gzip compression - enhanced for production
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/woff
    font/woff2;
  gzip_disable "msie6";

  # Brotli compression (if module available)
  # brotli on;
  # brotli_comp_level 6;
  # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Buffer sizes
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 4k;
  output_buffers 1 32k;
  postpone_output 1460;

  # SSL/TLS Configuration
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Security headers map - environment-aware CSP
  # In production/staging: all services are behind same ingress, so 'self' works
  # In local: need to allow localhost connections to different ports
  map $http_host $csp_connect_src {
    ~^localhost: "'self' http://localhost:8080 http://localhost:8888";
    default "'self'";
  }
  
  map $sent_http_content_type $csp_header {
    ~text/html "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src $csp_connect_src; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
    default "";
  }

  server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $csp_header always;
    
    # HSTS header (uncomment for HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    limit_conn perip 50;

    # Health check endpoint
    location = /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Serve static assets with aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header Vary "Accept-Encoding";
      limit_req zone=static burst=100 nodelay;
      
      # Security headers for static assets
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      
      try_files $uri =404;
    }

    # Handle manifest and service worker files
    location ~* \.(json|webmanifest)$ {
      expires 1d;
      add_header Cache-Control "public";
      add_header Content-Type application/json;
      try_files $uri =404;
    }

    # Handle all other routes by serving index.html for client-side routing
    location / {
      try_files $uri $uri/ /index.html;
      autoindex off;
    }

    # Prevent caching of index.html to avoid stale authentication state
    # See: https://github.com/authts/react-oidc-context/issues/1243
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      
      # Security headers for index.html
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy $csp_header always;
      
      try_files $uri =404;
    }

    # Security: deny access to hidden files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    # Security: deny access to sensitive files
    location ~* \.(env|git|svn|htaccess|htpasswd)$ {
      deny all;
      access_log off;
      log_not_found off;
    }

    # Custom error pages - fallback to SPA for 404s to enable client-side routing
    error_page 404 /index.html;
  }

  # HTTPS redirect server (uncomment when using SSL)
  # server {
  #   listen 80;
  #   listen [::]:80;
  #   server_name _;
  #   return 301 https://$host$request_uri;
  # }
}

events {
  worker_connections  1024;
  multi_accept        on;
  use                 epoll;
  epoll_events        512;
}