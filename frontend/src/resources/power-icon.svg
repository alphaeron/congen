  <!-- Power lines radiating outward -->
  <line x1="12" y1="2" x2="12" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="4" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="4" x2="14" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="8" x2="8" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="8" x2="16" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Strength indicator bars -->
  <rect x="4" y="14" width="2" height="6" fill="currentColor" opacity="0.7"/>
  <rect x="7" y="12" width="2" height="8" fill="currentColor" opacity="0.8"/>
  <rect x="10" y="10" width="2" height="10" fill="currentColor" opacity="0.9"/>
  <rect x="13" y="10" width="2" height="10" fill="currentColor" opacity="0.9"/>
  <rect x="16" y="12" width="2" height="8" fill="currentColor" opacity="0.8"/>
  <rect x="19" y="14" width="2" height="6" fill="currentColor" opacity="0.7"/>
  <!-- Energy sparks -->
  <circle cx="3" cy="3" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="21" cy="3" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="3" cy="21" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="21" cy="21" r="1" fill="currentColor" opacity="0.6"/>
</svg>
