<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solo Leveling inspired skill orb -->
  <!-- Outer glow ring -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <!-- Main orb -->
  <circle cx="12" cy="12" r="7" fill="currentColor" opacity="0.9"/>
  <!-- Inner glow -->
  <circle cx="12" cy="12" r="5" fill="currentColor" opacity="0.6"/>
  <!-- Core -->
  <circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.8"/>
  <!-- Skill symbol - simplified star -->
  <path d="M12 4 L13.5 8.5 L18 8.5 L14.5 11.5 L16 16 L12 13 L8 16 L9.5 11.5 L6 8.5 L10.5 8.5 Z" 
        fill="currentColor" opacity="1"/>
  <!-- Energy sparks -->
  <circle cx="4" cy="4" r="1" fill="currentColor" opacity="0.7"/>
  <circle cx="20" cy="4" r="1" fill="currentColor" opacity="0.7"/>
  <circle cx="4" cy="20" r="1" fill="currentColor" opacity="0.7"/>
  <circle cx="20" cy="20" r="1" fill="currentColor" opacity="0.7"/>
  <!-- Connecting energy lines -->
  <line x1="12" y1="12" x2="4" y2="4" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <line x1="12" y1="12" x2="20" y2="4" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <line x1="12" y1="12" x2="4" y2="20" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <line x1="12" y1="12" x2="20" y2="20" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
</svg>