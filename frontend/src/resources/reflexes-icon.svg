<?xml version="1.0" encoding="utf-8"?>
<!-- Perception/Reflexes Icon - Compass with Directional Lines -->
<svg fill="#000000" width="800px" height="800px" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
<title>perception</title>
<!-- Central compass circle -->
<circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
<!-- Traditional compass rose - North -->
<path d="M16 6 L20 14 L16 12 L12 14 Z" fill="currentColor"/>
<!-- Traditional compass rose - South -->
<path d="M16 26 L12 18 L16 20 L20 18 Z" fill="currentColor"/>
<!-- Traditional compass rose - East -->
<path d="M26 16 L18 12 L20 16 L18 20 Z" fill="currentColor"/>
<!-- Traditional compass rose - West -->
<path d="M6 16 L14 12 L12 16 L14 20 Z" fill="currentColor"/>
<!-- Central dot -->
<circle cx="16" cy="16" r="1.5" fill="currentColor"/>
</svg>