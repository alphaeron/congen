<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular gear/cogwheel -->
  <circle cx="12" cy="12" r="8" fill="currentColor"/>
  <circle cx="12" cy="12" r="4" fill="currentColor" opacity="0.3"/>
  <!-- Gear teeth -->
  <rect x="11" y="2" width="2" height="4" fill="currentColor"/>
  <rect x="11" y="18" width="2" height="4" fill="currentColor"/>
  <rect x="2" y="11" width="4" height="2" fill="currentColor"/>
  <rect x="18" y="11" width="4" height="2" fill="currentColor"/>
  <rect x="4.5" y="4.5" width="2" height="2" fill="currentColor" transform="rotate(45 5.5 5.5)"/>
  <rect x="17.5" y="4.5" width="2" height="2" fill="currentColor" transform="rotate(45 18.5 5.5)"/>
  <rect x="4.5" y="17.5" width="2" height="2" fill="currentColor" transform="rotate(45 5.5 18.5)"/>
  <rect x="17.5" y="17.5" width="2" height="2" fill="currentColor" transform="rotate(45 18.5 18.5)"/>
</svg>
