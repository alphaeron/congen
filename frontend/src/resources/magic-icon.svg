<?xml version="1.0" encoding="utf-8"?>
<!-- MP Icon - Square Flask with Diagonal Fill -->
<svg fill="#000000" width="800px" height="800px" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
<title>magic</title>
<!-- Cork (floating rectangle above bottle) -->
<rect x="12" y="5" width="8" height="5" fill="currentColor"/>
<!-- Trapezoidal flask body (smaller at top, wider at bottom) -->
<path d="M10 12 L22 12 L24 28 L8 28 Z" fill="none" stroke="currentColor" stroke-width="2"/>
<!-- Liquid fill (area below diagonal line) -->
<path d="M10 20 L22 18 L24 28 L8 28 Z" fill="currentColor"/>
<!-- Diagonal fill line -->
<path d="M10 20 L22 18" stroke="currentColor" stroke-width="2" fill="none"/>
</svg>