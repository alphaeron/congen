<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solo Leveling inspired Recovery/Healing icon -->
  <!-- Main healing orb -->
  <circle cx="12" cy="12" r="6" fill="currentColor" opacity="0.8"/>
  <!-- Inner healing symbol -->
  <path d="M12 8 L14 12 L12 16 L10 12 Z" fill="currentColor" opacity="0.9"/>
  <!-- Healing rays -->
  <line x1="12" y1="2" x2="12" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="2" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="18" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Diagonal healing rays -->
  <line x1="4" y1="4" x2="7" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="20" y1="4" x2="17" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="4" y1="20" x2="7" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="20" y1="20" x2="17" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Recovery indicators -->
  <circle cx="6" cy="6" r="1" fill="currentColor" opacity="0.5"/>
  <circle cx="18" cy="6" r="1" fill="currentColor" opacity="0.5"/>
  <circle cx="6" cy="18" r="1" fill="currentColor" opacity="0.5"/>
  <circle cx="18" cy="18" r="1" fill="currentColor" opacity="0.5"/>
  <!-- Healing aura -->
  <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
</svg>
