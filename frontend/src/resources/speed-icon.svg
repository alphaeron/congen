<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solo Leveling inspired Speed/Agility icon -->
  <!-- Lightning bolt main shape -->
  <path d="M12 2 L8 10 L12 10 L10 22 L16 14 L12 14 L14 2 Z" fill="currentColor" opacity="0.9"/>
  <!-- Speed lines -->
  <line x1="2" y1="8" x2="6" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="2" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="2" y1="16" x2="4" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Right side speed lines -->
  <line x1="18" y1="8" x2="22" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="19" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="16" x2="22" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Speed sparks -->
  <circle cx="4" cy="4" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="20" cy="4" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="4" cy="20" r="1" fill="currentColor" opacity="0.6"/>
  <circle cx="20" cy="20" r="1" fill="currentColor" opacity="0.6"/>
  <!-- Motion blur effect -->
  <ellipse cx="12" cy="12" rx="10" ry="3" fill="currentColor" opacity="0.1" transform="rotate(45 12 12)"/>
</svg>
