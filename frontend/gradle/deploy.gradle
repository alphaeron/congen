// Docker-related tasks

import groovy.json.JsonSlurper

// Get environment from project property, default to 'local'
ext.environment = project.hasProperty('environment') ? project.environment : 'local'

task dockerBuild {
    group = 'build'
    description = 'Build Docker image for the frontend (uses environment to determine build type)'
    dependsOn buildApp
    
    doLast {
        // Force rebuild by clearing any cached dist directory
        if (file('dist').exists()) {
            println "📦 Ensuring fresh build for Docker image..."
        }
        def buildType = (project.environment == 'production') ? 'production' : 'debug'
        
        def packageJson = file('package.json')
        def version = new JsonSlurper().parse(packageJson).version
        def hash = 'git rev-parse --short HEAD'.execute(null, projectDir).text.trim()
        def timestamp = System.currentTimeMillis()
        def tag = buildType == 'production' ? "${version}.${hash}" : "${version}.${hash}-${timestamp}-debug"
        def image = "congen-ui:${tag}"
        
        if (!file('dist').exists()) {
            throw new GradleException('Build failed: dist directory not found')
        }
        
        println "Building ${buildType} Docker image: ${image}"
        exec {
            workingDir projectDir
            commandLine 'docker', 'build', '--no-cache', '-t', image, '.'
        }
        project.ext.frontendImageTag = image
        println "${buildType.capitalize()} Docker image built: ${image}"
    }
}

task printImageTag {
    group = 'deployment'
    description = 'Print the Docker image tag for the frontend.'
    doLast {
        if (!project.ext.has('frontendImageTag')) {
            throw new GradleException('No frontend image tag found. Run dockerBuild first.')
        }
        println "Frontend Docker image tag: ${project.ext.frontendImageTag}"
    }
}

// Helper function to generate frontend image tag patch
def generateFrontendImageTagPatchForEnvironment(env, imageName) {
    def overlayDir = "../k8s/overlays/${env}"
    def patchFile = file("${overlayDir}/stage-7/patches/frontend-image-tag-patch.yaml")

    // Create the patch directory if it doesn't exist
    patchFile.parentFile.mkdirs()

    def patchContent = """apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
      - name: frontend
        image: ${imageName}
"""

    patchFile.text = patchContent
    println "✅ Generated frontend image tag patch for ${env}: ${imageName}"
}

// Task to build and prepare image for local environment
task prepareLocalImage {
    dependsOn dockerBuild
    description = 'Build and prepare Docker image for local minikube deployment'
    group = 'kubernetes'

    doLast {
        println "🚀 Preparing frontend image for local minikube deployment..."

        // Load image into minikube's Docker daemon
        println "📦 Loading image into minikube's Docker daemon..."
        exec {
            commandLine 'minikube', 'image', 'load', project.ext.frontendImageTag
        }
        println "✅ Image loaded into minikube: ${project.ext.frontendImageTag}"

        // Generate image tag patch for local with the current tag
        generateFrontendImageTagPatchForEnvironment('local', project.ext.frontendImageTag)
        println "✅ Generated frontend image tag patch for local: ${project.ext.frontendImageTag}"
    }
}

// Task to build and push image for remote environments (staging/production)
task prepareRemoteImage {
    dependsOn dockerBuild
    description = 'Build and push Docker image for remote registry deployment'
    group = 'kubernetes'

    doFirst {
        if (!project.hasProperty('remoteRegistry')) {
            throw new GradleException("remoteRegistry parameter is required for staging/production. Use: -PremoteRegistry=your-registry.example.com")
        }

        println "🚀 Preparing frontend image for remote registry deployment..."
        println "Remote registry: ${remoteRegistry}"
        println "Image tag: ${project.ext.frontendImageTag}"
    }

    doLast {
        def remoteImageName = "${remoteRegistry}/${remoteRegistryNamespace}/frontend:${project.ext.frontendImageTag.split(':')[1]}"

        // Tag and push to remote registry
        println "Tagging image for remote registry..."
        exec {
            commandLine 'docker', 'tag', project.ext.frontendImageTag, remoteImageName
        }

        println "Pushing image to remote registry..."
        exec {
            commandLine 'docker', 'push', remoteImageName
        }

        println "✅ Image pushed to remote registry: ${remoteImageName}"

        // Generate image tag patch for remote environment
        generateFrontendImageTagPatchForEnvironment(project.environment, remoteImageName)
    }
}

// Prepare deployment task that builds the image and generates manifest patches
task prepareDeployment {
    group = 'deployment'
    description = 'Build the frontend image and prepare deployment patches for the specified environment.'
    dependsOn dockerBuild
}

// Configure prepareDeployment dependencies based on environment
prepareDeployment.configure {
    if (project.environment == 'local') {
        dependsOn prepareLocalImage
    } else if (project.environment == 'staging' || project.environment == 'production') {
        dependsOn prepareRemoteImage
    }
} 