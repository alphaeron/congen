# Integration test profile configuration for integration tests
# This profile is used when running integration tests with the 'integration-test' Spring profile

# Server configuration for tests
server.port=0

# CORS configuration for integration tests
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Content-Type,Authorization,X-Requested-With
cors.exposed-headers=Content-Length,Content-Range
cors.max-age=3600

# Security configuration for tests - allow all requests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/congen
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/congen/protocol/openid-connect/certs

# Keycloak Configuration for integration tests
KEYCLOAK_REALM=congen
KEYCLOAK_URL=http://localhost:8080
KEYCLOAK_AUTH_URL=http://localhost:8080
KEYCLOAK_CLIENT_SECRET=congen-backend-secret

# Keycloak Service Account Configuration for integration tests
congen.keycloak.service_account.username=service-account-congen-backend
congen.keycloak.service_account.password=service-account-password

# Liquibase configuration for database migrations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:migrations/changelog-root.xml
spring.liquibase.contexts=integration-test

# Database configuration for Liquibase (will be overridden by TestContainers)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable metrics for tests
management.metrics.export.enabled=false