# Integration test profile configuration for integration tests
# This profile is used when running integration tests with the 'integration-test' Spring profile

# Server configuration for tests
server.port=0
spring.codec.max-in-memory-size=1MB
spring.webflux.max-initial-line-length=4096

# CORS configuration for integration tests
cors.allowed-origins=http://localhost:3000,http://localhost:8888,http://localhost:4200,https://example.com,https://app.congen.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Content-Type,Authorization,X-Requested-With,*
cors.exposed-headers=Content-Length,Content-Range,*
cors.max-age=3600

# Rate limiting configuration for testing
rate.limit.ip.max-requests=1000
rate.limit.ip.window-minutes=1
rate.limit.user.max-requests=100
rate.limit.payload.max-size=10MB

# Security configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/realms/test/protocol/openid-connect/certs

# Database configuration for testing
congen.postgres.writer.host=localhost
congen.postgres.reader.host=localhost
congen.postgres.port=5432
congen.postgres.username=postgres
congen.postgres.password=postgres
congen.postgres.db-name=postgres
congen.postgres.ssl-mode=false

# Liquibase configuration for database migrations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:migrations/changelog-root.xml
spring.liquibase.contexts=integration-test

# Disable metrics for tests
management.metrics.export.enabled=false

# Logging configuration for testing
logging.level.com.congen.components=DEBUG
logging.level.com.congen.config=DEBUG

# GDPR configuration for testing
congen.gdpr.audit-enabled=true

# Cache Warmup Configuration for testing
congen.cache.warmup.enabled=false
