spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.application.name=congen

server.subservice.metrics-namespace=congen

server.compression.enabled=true
server.compression.min-response-size=5120
server.compression.mime-types=application/json,application/x-protobuf

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

server.port=${SERVER_PORT:8888}

# Request size limits for DDoS protection
spring.codec.max-in-memory-size=1MB
spring.webflux.max-initial-line-length=4096

# Rate limiting configuration
rate.limit.ip.max-requests=1000
rate.limit.ip.window-minutes=1
rate.limit.user.max-requests=100
rate.limit.payload.max-size=10MB

# OpenAPI Documentation Configuration
# (Only enabled in staging and integration-test profiles)
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH}
springdoc.swagger-ui.operations-sorter=${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER}
springdoc.swagger-ui.tags-sorter=${SPRINGDOC_SWAGGER_UI_TAGS_SORTER}
springdoc.swagger-ui.doc-expansion=${SPRINGDOC_SWAGGER_UI_DOC_EXPANSION}
springdoc.swagger-ui.display-request-duration=${SPRINGDOC_SWAGGER_UI_DISPLAY_REQUEST_DURATION}
springdoc.swagger-ui.filter=${SPRINGDOC_SWAGGER_UI_FILTER}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}
cors.exposed-headers=${CORS_EXPOSED_HEADERS}
cors.max-age=${CORS_MAX_AGE}

# Bean Override Configuration
spring.main.allow-bean-definition-overriding=true

congen.postgres.writer.host=${PGWRITERHOST}
congen.postgres.reader.host=${PGREADERHOST}
congen.postgres.port=${PGPORT}
congen.postgres.username=${PGUSER}
congen.postgres.password=${PGPASSWORD}
congen.postgres.db-name=${PGDATABASE}
congen.postgres.ssl-mode=${PGSSLMODE}

# GDPR Compliance and Encryption Configuration
congen.encryption.key=${ENCRYPTION_KEY}
congen.gdpr.audit-enabled=${GDPR_AUDIT_ENABLED}
congen.gdpr.data-retention-check-enabled=${DATA_RETENTION_CHECK_ENABLED}

# Cache Warmup Configuration
congen.cache.warmup.enabled=true
congen.cache.warmup.warmup-reference-data=true
congen.cache.warmup.warmup-lists=true
congen.cache.warmup.warmup-relationships=true
congen.cache.warmup.warmup-user-data=true
congen.cache.warmup.max-users-to-warmup=10
congen.cache.warmup.popular-exercises=Bench Press,Back Squat,Deadlift,Overhead Press,Chin-Up,TRX Push-Up,Bent-Over Row,Split Squat,Front Squat,Landmine Row
congen.cache.warmup.popular-equipment=power bar,dumbbells,pull-up bar,bench,power rack
congen.cache.warmup.popular-muscles=pec major,lats,quadriceps,anterior deltoid,biceps,rectus abdominis

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCES}

# Keycloak Client Configuration
congen.keycloak.url=${KEYCLOAK_URL}
congen.keycloak.realm=${KEYCLOAK_REALM}
congen.keycloak.client.id=${KEYCLOAK_CLIENT_ID}
congen.keycloak.client.secret=${KEYCLOAK_CLIENT_SECRET}
congen.keycloak.service_account.username=${KEYCLOAK_SERVICE_ACCOUNT_USERNAME}
congen.keycloak.management.url=${CONGEN_KEYCLOAK_MANAGEMENT_URL}

# Memcached Configuration
memcached.host=${MEMCACHED_HOST}
memcached.port=${MEMCACHED_PORT}
memcached.connection-pool-size=${MEMCACHED_CONNECTION_POOL_SIZE}
memcached.op-timeout=${MEMCACHED_OP_TIMEOUT}
memcached.max-queued-noreply=${MEMCACHED_MAX_QUEUED_NOREPLY}
memcached.scheduler-thread-pool-size=${MEMCACHED_SCHEDULER_THREAD_POOL_SIZE}
memcached.scheduler-queue-capacity=${MEMCACHED_SCHEDULER_QUEUE_CAPACITY}
memcached.scheduler-thread-name-prefix=${MEMCACHED_SCHEDULER_THREAD_NAME_PREFIX}
memcached.use-elasticache=${MEMCACHED_USE_ELASTICACHE:false}
memcached.poll-config-interval-ms=${MEMCACHED_POLL_CONFIG_INTERVAL_MS:60000}

# Debug Logging Configuration
logging.level.com.congen=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.reactive=INFO
logging.level.org.springframework.web.server=INFO
logging.level.org.springframework.http.server.reactive=INFO

