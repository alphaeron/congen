spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.application.name=congen

server.subservice.metrics-namespace=congen

server.compression.enabled=true
server.compression.min-response-size=5120
server.compression.mime-types=application/json,application/x-protobuf

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

server.port=${SERVER_PORT:8888}

# OpenAPI Documentation Configuration
# (Only enabled in staging and integration-test profiles)
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH}
springdoc.swagger-ui.operationsSorter=${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER}
springdoc.swagger-ui.tagsSorter=${SPRINGDOC_SWAGGER_UI_TAGS_SORTER}
springdoc.swagger-ui.doc-expansion=${SPRINGDOC_SWAGGER_UI_DOC_EXPANSION}
springdoc.swagger-ui.display-request-duration=${SPRINGDOC_SWAGGER_UI_DISPLAY_REQUEST_DURATION}
springdoc.swagger-ui.filter=${SPRINGDOC_SWAGGER_UI_FILTER}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}
cors.exposed-headers=${CORS_EXPOSED_HEADERS}
cors.max-age=${CORS_MAX_AGE}

# Bean Override Configuration
spring.main.allow-bean-definition-overriding=true

congen.postgres.writer.host=${PGWRITERHOST:localhost}
congen.postgres.reader.host=${PGREADERHOST:localhost}
congen.postgres.port=${PGPORT:5432}
congen.postgres.username=${PGUSER:postgres}
congen.postgres.password=${PGPASSWORD:postgres}
congen.postgres.db-name=${PGDATABASE:postgres}
congen.postgres.ssl-mode=${PGSSLMODE:false}

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCES}

# Keycloak Client Configuration
congen.keycloak.url=${KEYCLOAK_URL}
congen.keycloak.realm=${KEYCLOAK_REALM}
congen.keycloak.client.id=${KEYCLOAK_CLIENT_ID}
congen.keycloak.client.secret=${KEYCLOAK_CLIENT_SECRET}
congen.keycloak.service_account.username=${KEYCLOAK_SERVICE_ACCOUNT_USERNAME}
