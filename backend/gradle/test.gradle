// Configure source sets
sourceSets {
    integrationTest {
        kotlin {
            srcDir 'src/integrationTest/kotlin'
        }
        resources {
            srcDirs 'src/integrationTest/resources', "resources"
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Configure integration test dependencies
// Note: Gradle automatically creates configurations for sourceSets, but we need to configure them before using them
configurations {
    integrationTestImplementation.extendsFrom implementation, testImplementation
}

// Test dependencies
dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.2.5'
    testImplementation 'org.springframework.security:spring-security-test:6.2.5'
    testImplementation 'io.projectreactor:reactor-test:3.6.5'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.23'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'

    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test:3.2.5'
    integrationTestImplementation 'org.springframework.security:spring-security-test:6.2.5'
    integrationTestImplementation 'io.projectreactor:reactor-test:3.6.5'
    integrationTestImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.23'
    integrationTestImplementation 'org.mockito:mockito-core:5.18.0'
    integrationTestImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'
    integrationTestImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    integrationTestImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    integrationTestImplementation 'org.testcontainers:postgresql:1.19.7'
    integrationTestImplementation 'com.github.dasniko:testcontainers-keycloak:3.8.0'
    
    // Liquibase dependencies for database migrations
    integrationTestImplementation 'org.liquibase:liquibase-core:4.26.0'
    integrationTestImplementation 'org.postgresql:postgresql:42.7.3'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-jdbc:3.2.5'
}

// Configure test tasks
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

// Configure integration tests
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests with full Kubernetes deployment'
    group = 'verification'

    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    // Disable parallel execution to avoid database constraint violations
    maxParallelForks = 1

    // Use integration test source set
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    // Set Spring profile for integration tests
    systemProperty 'spring.profiles.active', 'integration-test'

    // Setup port forwarding (which depends on deployment)
    dependsOn ':setupTestPortForward'
    finalizedBy ':cleanupPortForward'
}

// Configure the environment for integration tests
project.afterEvaluate {
    // Set environment for integration test deployment
    integrationTest.doFirst {
        project.ext.environment = 'local'
        println "🎯 Integration test deployment environment: ${project.ext.environment}"
    }
}

// Unit test task (excludes integration tests)
test {
    useJUnitPlatform()

    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }

    // Explicitly exclude integration tests from unit test run
    exclude '**/integrationTest/**'
    exclude '**/*IntegrationTest*'
    exclude '**/*Integration*'
}

jacocoTestReport {
    dependsOn test

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            '**/resources/*'
        ])
    }))

    reports {
        xml.required = true
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir("jacocoHtml")
    }
}

jacocoTestCoverageVerification {
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            '**/resources/*'
        ])
    }))

    violationRules {
        rule {
            limit {
                minimum = 1.0
            }
        }
    }
}

// Integration test coverage report
task jacocoIntegrationTestReport(type: JacocoReport) {
    dependsOn integrationTest

    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom(sourceSets.main.output.classesDirs)

    executionData.setFrom(fileTree(dir: layout.buildDirectory, includes: [
        'jacoco/integrationTest.exec'
    ]))

    reports {
        xml.required = true
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir("jacocoIntegrationTestHtml")
    }
}

tasks.named('processIntegrationTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Make check depend on all test types (moved to end after all tasks are defined)
check.dependsOn test, integrationTest
