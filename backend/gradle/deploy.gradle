// Version information for deployment
def versionInfo = versionDetails()
def timestamp = new Date().getTime()

// Get environment from project property, default to 'local'
ext.environment = project.hasProperty('environment') ? project.getProperty('environment') : 'local'

// Generate final image tag
def tag = "${versionInfo.branchName}-${versionInfo.gitHash}-${environment}-${timestamp}"

// Configurable registry settings
def localRegistryPort = project.hasProperty('localRegistryPort') ? project.getProperty('localRegistryPort') : '5001'
def remoteRegistry = project.hasProperty('remoteRegistry') ? project.getProperty('remoteRegistry') : 'your-registry.example.com'
def remoteRegistryNamespace = project.hasProperty('remoteRegistryNamespace') ? project.getProperty('remoteRegistryNamespace') : 'congen'

// Task to generate version properties
task generateVersionProperties {
    doLast {
        def versionProps = new Properties()
        versionProps.setProperty('app.version', version)
        versionProps.setProperty('app.releaseId', tag)
        versionProps.setProperty('app.buildTime', new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'"))
        versionProps.setProperty('app.gitHash', versionInfo.gitHash)
        versionProps.setProperty('app.gitBranch', versionInfo.branchName)
        versionProps.setProperty('app.gitDirty', versionInfo.isCleanTag ? 'false' : 'true')

        def versionFile = file("${sourceSets.main.resources.srcDirs.first()}/version.properties")
        versionFile.parentFile.mkdirs()
        versionFile.withOutputStream { versionProps.store(it, 'Generated version information') }
    }
}

// Make processResources depend on generateVersionProperties
processResources.dependsOn generateVersionProperties

// JIB configuration for Docker image building
jib {
    from {
        image = 'docker://amazoncorretto:17.0.11-alpine3.19'
    }
    to {
        image = 'backend'
        tags = [tag]
    }
    container {
        appRoot = '/app'
        workingDirectory = '/app/classes'
        creationTime = 'USE_CURRENT_TIMESTAMP'
        entrypoint = [
            'sh', '-c',
            'java -XX:+UseG1GC ' +
            '-Xms${JVM_HEAP_MIN:-256m} -Xmx${JVM_HEAP_MAX:-384m} ' +
            '-XX:MetaspaceSize=${JVM_METASPACE_MIN:-64M} -XX:MaxMetaspaceSize=${JVM_METASPACE_MAX:-128M} ' +
            '-XX:ActiveProcessorCount=2 ' +
            '-Djava.security.edg=file:/dev/./urandom ' +
            '-Dspring.profiles.active=${SPRING_PROFILES_ACTIVE:-local} ' +
            '-classpath /app/resources:/app/classes:/app/libs/* ' +
            'com.congen.CongenApplicationKt'
        ]
    }
}

// Task to create migrations ConfigMap
task createMigrationsConfigMap {
    dependsOn processResources
    description = 'Generate migrations ConfigMap from Liquibase migration files'
    group = 'kubernetes'

    doLast {
        def migrationsDir = file('resources/migrations')
        def outputFile = file('../k8s/base/stage-5/migrations-configmap.yaml')

        if (!migrationsDir.exists()) {
            throw new GradleException("Migrations directory not found: ${migrationsDir.absolutePath}")
        }

        // Create the ConfigMap content
        def configMapContent = """apiVersion: v1
kind: ConfigMap
metadata:
  name: migrations-config
  namespace: congen
data:
"""

        // Add each migration file to the ConfigMap with proper directory structure
        migrationsDir.eachFileRecurse { file ->
            if (file.isFile() && (file.name.endsWith('.sql') || file.name.endsWith('.xml') || file.name == 'liquibase.properties')) {
                def relativePath = file.path.substring(migrationsDir.path.length() + 1)
                def content = file.text

                // Create the proper directory structure in the ConfigMap
                def key = relativePath.replaceAll(/[^a-zA-Z0-9._-]/, '_')

                configMapContent += "  ${key}: |-\n"
                content.split('\n').each { line ->
                    configMapContent += "    ${line}\n"
                }
            }
        }

        // Write the ConfigMap to file
        outputFile.parentFile.mkdirs()
        outputFile.text = configMapContent

        println "✅ Generated migrations ConfigMap: ${outputFile.absolutePath}"
    }
}

// Task to build and prepare image for local environment
task prepareLocalImage {
    dependsOn jibDockerBuild
    description = 'Build and prepare Docker image for local minikube deployment'
    group = 'kubernetes'

    doLast {
        println "🚀 Preparing image for local minikube deployment..."

        // Load image into minikube's Docker daemon
        println "📦 Loading image into minikube's Docker daemon..."
        exec {
            commandLine 'minikube', 'image', 'load', "backend:${tag}"
        }
        println "✅ Image loaded into minikube: backend:${tag}"

        // Generate image tag patch for local with the current tag
        generateImageTagPatchForEnvironment('local', "backend:${tag}")
        println "✅ Generated image tag patch for local: backend:${tag}"
    }
}

// Task to build and push image for remote environments (staging/production)
task prepareRemoteImage {
    dependsOn jibDockerBuild
    description = 'Build and push Docker image for remote registry deployment'
    group = 'kubernetes'

    doFirst {
        if (!project.hasProperty('remoteRegistry')) {
            throw new GradleException("remoteRegistry parameter is required for staging/production. Use: -PremoteRegistry=your-registry.example.com")
        }

        println "🚀 Preparing image for remote registry deployment..."
        println "Remote registry: ${remoteRegistry}"
        println "Image tag: ${tag}"
    }

    doLast {
        def remoteImageName = "${remoteRegistry}/${remoteRegistryNamespace}/backend:${tag}"

        // Tag and push to remote registry
        println "Tagging image for remote registry..."
        exec {
            commandLine 'docker', 'tag', "backend:${tag}", remoteImageName
        }

        println "Pushing image to remote registry..."
        exec {
            commandLine 'docker', 'push', remoteImageName
        }

        println "✅ Image pushed to remote registry: ${remoteImageName}"

        // Generate image tag patch for remote environment
        generateImageTagPatchForEnvironment(environment, remoteImageName)
    }
}

// Helper function to generate image tag patch
def generateImageTagPatchForEnvironment(env, imageName) {
    def overlayDir = "../k8s/overlays/${env}"
    def patchFile = file("${overlayDir}/stage-7/patches/backend-image-tag-patch.yaml")

    // Create the patch directory if it doesn't exist
    patchFile.parentFile.mkdirs()

    def patchContent = """apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
      - name: backend
        image: ${imageName}
"""

    patchFile.text = patchContent
    println "✅ Generated image tag patch for ${env}: ${imageName}"
}

task prepareDeployment {
    group = 'deployment'
    description = 'Prepare backend for deployment (build image, patch manifests, generate configmaps, etc.)'
    
    doFirst {
        println "🚀 Preparing backend deployment..."
    }
}

prepareDeployment.dependsOn createMigrationsConfigMap
if (project.environment == 'local') {
    prepareDeployment.dependsOn prepareLocalImage
} else if (project.environment == 'staging' || project.environment == 'production') {
    prepareDeployment.dependsOn prepareRemoteImage
}
