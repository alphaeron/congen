plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.jetbrains.kotlin.jvm' version '1.9.23'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.23'

    // KDoc (Dokka) documentation generation
    // Usage: ./gradlew dokkaHtml
    // Output: build/dokka/
    id 'org.jetbrains.dokka' version '1.9.20'

    id 'com.google.cloud.tools.jib' version '3.4.2'
    id 'com.palantir.git-version' version '3.0.0'

    id 'jacoco'
}

apply from: './gradle/test.gradle'
apply from: './gradle/style.gradle'
apply from: './gradle/docs.gradle'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileKotlin {
    kotlinOptions {
        freeCompilerArgs = ["-Xjsr305=strict"]
        jvmTarget = "17"
    }
}
compileTestKotlin {
    kotlinOptions {
        freeCompilerArgs = ["-Xjsr305=strict"]
        jvmTarget = "17"
    }
}
compileIntegrationTestKotlin {
    kotlinOptions {
        freeCompilerArgs = ["-Xjsr305=strict"]
        jvmTarget = "17"
    }
}

repositories {
	  mavenCentral()
}

group = 'com.congen'
version = '0.0.1-SNAPSHOT'

def versionInfo = versionDetails()
def timestamp = new Date().getTime()
def tag = "${versionInfo.branchName}-${versionInfo.gitHash}-${timestamp}"

// Task to generate version properties
task generateVersionProperties {
    doLast {
        def versionProps = new Properties()
        versionProps.setProperty('app.version', version)
        versionProps.setProperty('app.releaseId', tag)
        versionProps.setProperty('app.buildTime', new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'"))
        versionProps.setProperty('app.gitHash', versionInfo.gitHash)
        versionProps.setProperty('app.gitBranch', versionInfo.branchName)
        versionProps.setProperty('app.gitDirty', versionInfo.isCleanTag ? 'false' : 'true')
        
        def versionFile = file("${sourceSets.main.resources.srcDirs.first()}/version.properties")
        versionFile.parentFile.mkdirs()
        versionFile.withOutputStream { versionProps.store(it, 'Generated version information') }
    }
}

// Make processResources depend on generateVersionProperties
processResources.dependsOn generateVersionProperties

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux:3.2.5'
    //implementation 'org.springframework.boot:spring-boot-starter-security:3.2.5'
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.2.5'

    implementation 'org.springdoc:springdoc-openapi-webflux-ui:1.8.0'
    implementation 'org.springdoc:springdoc-openapi-kotlin:1.8.0'
    implementation 'org.springdoc:springdoc-openapi-javadoc:1.8.0'

    implementation 'io.vertx:vertx-pg-client:4.5.8'
    // See https://vertx.io/docs/vertx-pg-client/java/#_sasl_scram_sha_256_authentication_mechanism
    implementation 'com.ongres.scram:client:2.1'

    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.17.0'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.23'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.23'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor:1.8.0'

    implementation 'io.projectreactor.kotlin:reactor-kotlin-extensions:1.2.2'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.12'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.2.5'
    //testImplementation 'org.springframework.security:spring-security-test:6.2.4'
    testImplementation 'io.projectreactor:reactor-test:3.6.5'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.23'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    
    integrationTestImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    integrationTestImplementation 'org.testcontainers:postgresql:1.19.3'
}

configurations {
    integrationTestImplementation.extendsFrom implementation, testImplementation
}

jib {
    from {
        image = 'docker://amazoncorretto:17.0.11-alpine3.19'
    }
    to {
        image = 'congen'
        tags = [tag]
    }
    container {
        appRoot = '/app'
        workingDirectory = '/app/classes'
        creationTime = 'USE_CURRENT_TIMESTAMP'
        entrypoint = [
            'java',
            '-XX:+UseG1GC', '-Xms2048m', '-Xmx2048m',
            '-XX:MetaspaceSize=256M', '-XX:MaxMetaspaceSize=256M',
            '-XX:ActiveProcessorCount=2',
            '-Djava.security.edg=file:/dev/./urandom',
            '-classpath', '/app/resources:/app/classes:/app/libs/*',
            'com.congen.CongenApplicationKt'
        ]
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xjsr305=strict"]
    }
}
