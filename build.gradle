// Top-level build.gradle for multi-project build

// The following line is required to make the dependency-license-report plugin available for use in gradle/style.gradle.
// This does NOT configure the plugin; all configuration remains in style.gradle.
plugins {
    id 'com.github.jk1.dependency-license-report' version '1.16' apply false
}

subprojects {
    // Common configuration for all subprojects can go here if needed
}

apply from: 'gradle/skaffold.gradle'
apply from: 'gradle/deploy.gradle'
apply from: 'gradle/security.gradle'
apply from: 'gradle/style.gradle'
apply from: 'gradle/test.gradle'

task check {
    group = 'verification'
    description = 'Run all checks in all subprojects including security audit.'
    dependsOn subprojects.collect { it.path + ':check' }
    dependsOn securityAudit
}

task build {
    group = 'build'
    description = 'Build all subprojects.'
    dependsOn subprojects.collect { it.path + ':build' }
}

task clean {
    group = 'build'
    description = 'Clean all subprojects.'
    dependsOn subprojects.collect { it.path + ':clean' }
}