// Top-level build.gradle for multi-project build

subprojects {
    // Common configuration for all subprojects can go here if needed
}

apply from: 'gradle/skaffold.gradle'
apply from: 'gradle/deploy.gradle'

task check {
    group = 'verification'
    description = 'Run all checks in all subprojects.'
    dependsOn subprojects.collect { it.path + ':check' }
}

task build {
    group = 'build'
    description = 'Build all subprojects.'
    dependsOn subprojects.collect { it.path + ':build' }
}

task clean {
    group = 'build'
    description = 'Clean all subprojects.'
    dependsOn subprojects.collect { it.path + ':clean' }
}