// Configure integration test dependencies
// Note: Gradle automatically creates configurations for sourceSets, but we need to configure them before using them
configurations {
    integrationTestImplementation.extendsFrom implementation, testImplementation
}

// Test dependencies
dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.2.5'
    //testImplementation 'org.springframework.security:spring-security-test:6.2.4'
    testImplementation 'io.projectreactor:reactor-test:3.6.5'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.23'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.18.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'

    integrationTestImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    integrationTestImplementation 'org.testcontainers:postgresql:1.19.3'
}

// Define source sets for unit and integration tests
sourceSets {
    test {
        kotlin {
            srcDirs = ['src/test/kotlin']
        }
        resources {
            srcDir 'src/test/resources'
        }
    }
    integrationTest {
        kotlin {
            srcDir 'src/integrationTest/kotlin'
        }
        resources {
            srcDir 'src/integrationTest/resources'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Unit test task (excludes integration tests)
test {
    useJUnitPlatform()

    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }

    // Explicitly exclude integration tests from unit test run
    exclude '**/integrationTest/**'
    exclude '**/*IntegrationTest*'
    exclude '**/*Integration*'
}

jacocoTestReport {
    dependsOn test

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            '**/resources/*'
        ])
    }))

    reports {
        xml.required = true
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir("jacocoHtml")
    }
}

jacocoTestCoverageVerification {
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            '**/resources/*'
        ])
    }))

    violationRules {
        rule {
            limit {
                minimum = 1.0
            }
        }
    }
}

// Integration test task
// To run integration tests, first start the required resources:
// 1. Start Minikube: minikube start
// 2. Run: ./gradlew integrationTest
task integrationTest(type: Test) {
    description = 'Runs integration tests against Kubernetes cluster'
    group = 'verification'

    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath

    useJUnitPlatform()

    systemProperty 'spring.profiles.active', 'integration-test'

    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }

    // Setup Kubernetes environment before tests
    dependsOn 'setupKubernetesForTesting'

    // Cleanup port forwarding after tests
    finalizedBy 'cleanupPortForward'
}

// Integration test coverage report
task jacocoIntegrationTestReport(type: JacocoReport) {
    dependsOn integrationTest

    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom(sourceSets.main.output.classesDirs)

    executionData.setFrom(fileTree(dir: layout.buildDirectory, includes: [
        'jacoco/integrationTest.exec'
    ]))

    reports {
        xml.required = true
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir("jacocoIntegrationTestHtml")
    }
}

tasks.named('processIntegrationTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Task to setup Kubernetes environment for testing
task setupKubernetesForTesting {
    description = 'Setup Kubernetes environment for integration testing'
    group = 'verification'

    // Set environment property at configuration time
    project.ext.set('environment', 'local')

    dependsOn 'deployToKubernetes', 'setupTestPortForward'
}

// Task to check Kubernetes test environment status
task checkKubernetesTestEnv {
    description = 'Check Kubernetes test environment status'
    group = 'verification'

    doLast {
        exec {
            commandLine 'kubectl', 'get', 'pods', '-n', 'congen'
        }
    }
}

// Task to cleanup port forwarding
task cleanupPortForward {
    description = 'Cleanup port forwarding for integration tests'
    group = 'verification'

    doLast {
        println "🧹 Cleaning up port forwarding..."

        // Try to kill using PID file first
        exec {
            commandLine 'sh', '-c', 'if [ -f /tmp/port-forward.pid ]; then kill $(cat /tmp/port-forward.pid) 2>/dev/null; rm -f /tmp/port-forward.pid; fi'
            ignoreExitValue = true
        }

        // Fallback to pkill
        exec {
            commandLine 'pkill', '-f', 'kubectl port-forward.*postgres'
            ignoreExitValue = true
        }

        println "✅ Port forwarding cleanup complete"
    }
}

// Make check depend on all test types (moved to end after all tasks are defined)
check.dependsOn test, integrationTest
