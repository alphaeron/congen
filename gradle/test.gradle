// Define source sets for unit and integration tests
sourceSets {
    test {
        java {
            srcDirs = ['src/test/kotlin']
        }
    }
    integrationTest {
        kotlin {
            srcDir 'src/integrationTest/kotlin'
        }
        resources {
            srcDir 'src/integrationTest/resources'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

// Unit test task (excludes integration tests)
test {
    useJUnitPlatform()

    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
    
    // Explicitly exclude integration tests from unit test run
    exclude '**/integrationTest/**'
}

jacocoTestReport {
    dependsOn test

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            '**/resources/*'
        ])
    }))

    reports {
        xml.required = true
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir("jacocoHtml")
    }
}

jacocoTestCoverageVerification {
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            '**/resources/*'
        ])
    }))

    violationRules {
        rule {
            limit {
                minimum = 1.0
            }
        }
    }
}

// Integration test task
// To run integration tests, first start the required resources:
// 1. Start PostgreSQL: docker-compose up -d postgres
// 2. Wait for PostgreSQL to be ready (check with: docker-compose ps)
// 3. Run: ./gradlew integrationTest -PrunIntegrationTests
task integrationTest(type: Test) {
    description = 'Runs integration tests'
    group = 'verification'
    
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    
    useJUnitPlatform()
    
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
    
    // // Only run integration tests if explicitly requested
    // onlyIf {
    //     project.hasProperty('runIntegrationTests')
    // }
    
    // Don't depend on unit tests
    dependsOn = []

    // Use both the test and integration-test Spring profiles
    systemProperty 'spring.profiles.active', 'test,integration-test'
    
    // Disable JUnit and Spring parallel execution (redundant, but safe)
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    systemProperty 'spring.test.context.parallel.enabled', 'false'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'same_thread'
    maxParallelForks = 1
    forkEvery = 0
}

// Integration test coverage report
task jacocoIntegrationTestReport(type: JacocoReport) {
    dependsOn integrationTest

    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom(sourceSets.main.output.classesDirs)

    executionData.setFrom(fileTree(dir: layout.buildDirectory, includes: [
        'jacoco/integrationTest.exec'
    ]))

    reports {
        xml.required = true
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir("jacocoIntegrationTestHtml")
    }
}

tasks.named('processIntegrationTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
