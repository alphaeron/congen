// Note: Spotless configuration is handled in individual subprojects
// Root project only contains shared tasks that don't require plugins

task kubeval(type: Exec, group: 'verification') {
    description = 'Lint Kubernetes manifests with kubeval'
    commandLine 'sh', '-c', 'kustomize build k8s/base | kubeval --ignore-missing-schemas'
}

task kubeLinter(type: Exec, group: 'verification') {
    description = 'Lint Kubernetes manifests with kube-linter for all environments'
    commandLine 'sh', '-c', '''
        echo "=== Linting Production Overlay ===" &&
        kube-linter lint --exclude=latest-tag,no-read-only-root-fs,unset-cpu-requirements,unset-memory-requirements,run-as-non-root,mismatching-selector k8s/overlays/production &&
        echo "=== Linting Staging Overlay ===" &&
        kube-linter lint --exclude=latest-tag,no-read-only-root-fs,unset-cpu-requirements,unset-memory-requirements,run-as-non-root,mismatching-selector k8s/overlays/staging &&
        echo "=== Linting Local Overlay (Development) ===" &&
        kube-linter lint --exclude=latest-tag,no-read-only-root-fs,unset-cpu-requirements,unset-memory-requirements,run-as-non-root,mismatching-selector k8s/overlays/local &&
        echo "=== Linting Base Kubernetes Resources ===" &&
        kube-linter lint --exclude=latest-tag,no-read-only-root-fs,unset-cpu-requirements,unset-memory-requirements,run-as-non-root k8s/base
    '''
}

task kubectlDryRun(type: Exec, group: 'verification') {
    description = 'Validate base kustomize output with kubectl dry-run'
    commandLine 'kubectl', 'apply', '--dry-run=client', '-k', 'k8s/base'
}

task shellCheck(type: Exec, group: 'verification') {
    description = 'Lint all bash scripts with ShellCheck'
    commandLine 'sh', '-c', 'if [ -d "scripts" ]; then find scripts -name "*.sh" | xargs shellcheck; else echo "No scripts directory found, skipping shellCheck"; fi'
}

task kubeCheck(group: 'verification', description: 'Comprehensive Kubernetes linting (kubeval, kube-linter, kubectl dry-run)') {
    dependsOn kubeval, kubeLinter, kubectlDryRun
}

// Gradle-specific linting tasks
// Note: Gradle linting is handled by spotlessCheck via gradleCheck task

task gradleFormat(type: Exec, group: 'formatting') {
    description = 'Format Gradle build files using Spotless'
    commandLine './gradlew', 'spotlessApply'
}

task gradleCheck(type: Exec, group: 'verification') {
    description = 'Check Gradle build files formatting using Spotless'
    commandLine './gradlew', 'spotlessCheck'
}

// JSON formatting and linting tasks
task jsonFormat(type: Exec, group: 'formatting') {
    description = 'Format JSON files using jq'
    doFirst {
        def jqPath = exec {
            commandLine 'which', 'jq'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (jqPath.exitValue != 0) {
            throw new GradleException("jq not found. Please install jq: https://stedolan.github.io/jq/download/")
        }
    }
    commandLine 'sh', '-c', '''
        find . -name "*.json" -type f | grep -v node_modules | grep -v .terraform | while read file; do
            echo "Formatting: $file"
            jq . "$file" > "$file.tmp" && mv "$file.tmp" "$file"
        done
    '''
}

task jsonFormatCheck(type: Exec, group: 'verification') {
    description = 'Check JSON files formatting using jq'
    doFirst {
        def jqPath = exec {
            commandLine 'which', 'jq'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (jqPath.exitValue != 0) {
            throw new GradleException("jq not found. Please install jq: https://stedolan.github.io/jq/download/")
        }
    }
    commandLine 'sh', '-c', '''
        find . -name "*.json" -type f | grep -v node_modules | grep -v .terraform | while read file; do
            echo "Checking: $file"
            if ! jq . "$file" > /dev/null 2>&1; then
                echo "❌ Invalid JSON: $file"
                exit 1
            fi
            if ! jq . "$file" | diff "$file" - > /dev/null; then
                echo "❌ JSON not properly formatted: $file"
                exit 1
            fi
        done
        echo "✅ All JSON files are valid and properly formatted"
    '''
}

task jsonValidate(type: Exec, group: 'verification') {
    description = 'Validate JSON files syntax'
    doFirst {
        def jqPath = exec {
            commandLine 'which', 'jq'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (jqPath.exitValue != 0) {
            throw new GradleException("jq not found. Please install jq: https://stedolan.github.io/jq/download/")
        }
    }
    commandLine 'sh', '-c', '''
        find . -name "*.json" -type f | grep -v node_modules | grep -v .terraform | while read file; do
            echo "Validating: $file"
            if ! jq . "$file" > /dev/null 2>&1; then
                echo "❌ Invalid JSON syntax: $file"
                exit 1
            fi
        done
        echo "✅ All JSON files have valid syntax"
    '''
}

task jsonCheck(group: 'verification', description: 'Comprehensive JSON validation (format check, syntax validation)') {
    dependsOn jsonFormatCheck, jsonValidate
}

// Terraform formatting and linting tasks
task terraformFormat(type: Exec, group: 'formatting') {
    description = 'Format Terraform files using terraform fmt'
    doFirst {
        def terraformPath = exec {
            commandLine 'which', 'terraform'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (terraformPath.exitValue != 0) {
            throw new GradleException("terraform not found. Please install Terraform 1.12.2: https://developer.hashicorp.com/terraform/downloads")
        }
    }
    commandLine 'sh', '-c', 'find terraform -name "*.tf" -o -name "*.tfvars" | xargs terraform fmt -write'
}

task terraformFormatCheck(type: Exec, group: 'verification') {
    description = 'Check Terraform files formatting using terraform fmt'
    doFirst {
        def terraformPath = exec {
            commandLine 'which', 'terraform'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (terraformPath.exitValue != 0) {
            throw new GradleException("terraform not found. Please install Terraform 1.12.2: https://developer.hashicorp.com/terraform/downloads")
        }
    }
    commandLine 'sh', '-c', 'find terraform -name "*.tf" -o -name "*.tfvars" | xargs terraform fmt -check'
}

task terraformValidate(type: Exec, group: 'verification') {
    description = 'Validate Terraform configurations for all environments'
    doFirst {
        def terraformPath = exec {
            commandLine 'which', 'terraform'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (terraformPath.exitValue != 0) {
            throw new GradleException("terraform not found. Please install Terraform 1.12.2: https://developer.hashicorp.com/terraform/downloads")
        }
    }
    commandLine 'sh', '-c', '''
        echo "=== Validating Local Environment ===" &&
        cd terraform/environments/local && terraform init -backend=false && terraform validate &&
        echo "=== Validating Staging Environment ===" &&
        cd ../staging && terraform init -backend=false && terraform validate &&
        echo "=== Validating Production Environment ===" &&
        cd ../production && terraform init -backend=false && terraform validate
    '''
}

task terraformLint(type: Exec, group: 'verification') {
    description = 'Lint Terraform files using tflint'
    doFirst {
        def tflintPath = exec {
            commandLine 'which', 'tflint'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (tflintPath.exitValue != 0) {
            println "⚠️  tflint not found. Skipping Terraform linting. Install tflint: https://github.com/terraform-linters/tflint#installation"
            // Skip the task by setting a dummy command
            commandLine 'echo', 'tflint not available, skipping'
            return
        }
    }
    commandLine 'sh', '-c', 'find terraform -name ".tflint.hcl" -execdir tflint \\;'
}

task terraformCheck(group: 'verification', description: 'Comprehensive Terraform validation (format, validate, lint)') {
    dependsOn terraformFormatCheck, terraformValidate, terraformLint
}

// License checking configuration using Gradle License Report plugin
// This configuration applies to all subprojects

subprojects {
    if (file('build.gradle').exists()) {
        apply plugin: 'com.github.jk1.dependency-license-report'

        afterEvaluate {
            licenseReport {
                configurations = ALL
                allowedLicensesFile = new File("$rootProject.projectDir/gradle/config/allowed-licenses.json")
                // Use string-based configuration to avoid compilation-time class resolution
                filters = [Class.forName('com.github.jk1.license.filter.LicenseBundleNormalizer', true, buildscript.classLoader)
                    .getConstructor(Map)
                    .newInstance([bundlePath: "$rootProject.projectDir/gradle/config/license-normalizer-bundle.json"])]
                // Skip renderers to avoid Gradle validation warnings
            }
        }

        tasks.matching { it.name == 'check' }.all {
            dependsOn 'checkLicense'
        }
    }
}

// Frontend license checking task using license-checker
task checkFrontendLicenses(type: Exec, group: 'verification', description: 'Check for forbidden licenses in frontend dependencies') {
    workingDir = file('frontend')
    
    doFirst {
        // Check if license-checker is available
        def licenseCheckerPath = exec {
            commandLine 'which', 'license-checker'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        
        if (licenseCheckerPath.exitValue != 0) {
            throw new GradleException("license-checker not found. Please install with: npm install -g license-checker")
        }
        
        // Read allowed licenses from the single source of truth JSON file
        def allowedLicensesFile = new File("$rootProject.projectDir/gradle/config/allowed-licenses.json")
        def allowedLicensesJson = new groovy.json.JsonSlurper().parse(allowedLicensesFile)
        def allowedLicenses = allowedLicensesJson.allowedLicenses.collect { it.moduleLicense }.findAll { it != null }
        
        def allowedLicensesString = allowedLicenses.join(';')
        
        commandLine 'sh', '-c', """
            if [ -f "package.json" ]; then
                if license-checker --onlyAllow "${allowedLicensesString}" --summary; then
                    echo "✅ No forbidden licenses found in frontend dependencies"
                else
                    echo "❌ Forbidden licenses found in frontend dependencies"
                    exit 1
                fi
            else
                echo "No package.json found in frontend directory"
            fi
        """
    }
}

task checkLicenses(group: 'verification', description: 'Check for forbidden licenses in all subprojects') {
    dependsOn subprojects.collect { it.path + ':checkLicense' }
    dependsOn checkFrontendLicenses
}

// Comprehensive linting task that includes Gradle files and security audit
// Only depends on shared (non-backend) tasks now
task allLint(group: 'verification', description: 'Run all shared linting checks including Gradle files and security audit') {
    dependsOn subprojects.collect { it.path + ':allLint' }
    dependsOn shellCheck, kubeCheck, gradleCheck, terraformCheck, jsonCheck, checkLicenses, securityAudit
}

task allFormat(group: 'formatting', description: 'Format all shared code including Gradle files') {
    dependsOn subprojects.collect { it.path + ':allFormat' }
    dependsOn gradleFormat, terraformFormat, jsonFormat
}
