// Note: Spotless configuration is handled in individual subprojects
// Root project only contains shared tasks that don't require plugins

task kubeval(type: Exec, group: 'verification') {
    description = 'Lint Kubernetes manifests with kubeval'
    commandLine 'sh', '-c', 'kustomize build k8s/overlays/production | kubeval --ignore-missing-schemas'
}

task kubeLinter(type: Exec, group: 'verification') {
    description = 'Lint Kubernetes manifests with kube-linter for all environments'
    commandLine 'sh', '-c', '''
        echo "=== Linting Production Overlay ===" &&
        kustomize build k8s/overlays/production | kube-linter lint --exclude=latest-tag,no-read-only-root-fs,unset-cpu-requirements,unset-memory-requirements,run-as-non-root - &&
        echo "=== Linting Staging Overlay ===" &&
        kustomize build k8s/overlays/staging | kube-linter lint --exclude=latest-tag,no-read-only-root-fs,unset-cpu-requirements,unset-memory-requirements,run-as-non-root - &&
        echo "=== Linting Local Overlay (Development) ===" &&
        kustomize build k8s/overlays/local | kube-linter lint --exclude=latest-tag,no-read-only-root-fs,unset-cpu-requirements,unset-memory-requirements,run-as-non-root -
    '''
}

task kubectlDryRun(type: Exec, group: 'verification') {
    description = 'Validate kustomize output with kubectl dry-run'
    commandLine 'kubectl', 'apply', '--dry-run=client', '-k', 'k8s/overlays/production'
}

task shellCheck(type: Exec, group: 'verification') {
    description = 'Lint all bash scripts with ShellCheck'
    commandLine 'sh', '-c', 'if [ -d "scripts" ]; then find scripts -name "*.sh" | xargs shellcheck; else echo "No scripts directory found, skipping shellCheck"; fi'
}

task kubeCheck(group: 'verification', description: 'Comprehensive Kubernetes linting (kubeval, kube-linter, kubectl dry-run)') {
    dependsOn kubeval, kubeLinter, kubectlDryRun
}

// Gradle-specific linting tasks
// Note: Gradle linting is handled by spotlessCheck via gradleCheck task

task gradleFormat(type: Exec, group: 'formatting') {
    description = 'Format Gradle build files using Spotless'
    commandLine './gradlew', 'spotlessApply'
}

task gradleCheck(type: Exec, group: 'verification') {
    description = 'Check Gradle build files formatting using Spotless'
    commandLine './gradlew', 'spotlessCheck'
}

// Terraform formatting and linting tasks
task terraformFormat(type: Exec, group: 'formatting') {
    description = 'Format Terraform files using terraform fmt'
    doFirst {
        def terraformPath = exec {
            commandLine 'which', 'terraform'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (terraformPath.exitValue != 0) {
            throw new GradleException("terraform not found. Please install Terraform 1.12.2: https://developer.hashicorp.com/terraform/downloads")
        }
    }
    commandLine 'sh', '-c', 'find terraform -name "*.tf" -o -name "*.tfvars" | xargs terraform fmt -write'
}

task terraformFormatCheck(type: Exec, group: 'verification') {
    description = 'Check Terraform files formatting using terraform fmt'
    doFirst {
        def terraformPath = exec {
            commandLine 'which', 'terraform'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (terraformPath.exitValue != 0) {
            throw new GradleException("terraform not found. Please install Terraform 1.12.2: https://developer.hashicorp.com/terraform/downloads")
        }
    }
    commandLine 'sh', '-c', 'find terraform -name "*.tf" -o -name "*.tfvars" | xargs terraform fmt -check'
}

task terraformValidate(type: Exec, group: 'verification') {
    description = 'Validate Terraform configurations for all environments'
    doFirst {
        def terraformPath = exec {
            commandLine 'which', 'terraform'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (terraformPath.exitValue != 0) {
            throw new GradleException("terraform not found. Please install Terraform 1.12.2: https://developer.hashicorp.com/terraform/downloads")
        }
    }
    commandLine 'sh', '-c', '''
        echo "=== Validating Local Environment ===" &&
        cd terraform/environments/local && terraform init -backend=false && terraform validate &&
        echo "=== Validating Staging Environment ===" &&
        cd ../staging && terraform init -backend=false && terraform validate &&
        echo "=== Validating Production Environment ===" &&
        cd ../production && terraform init -backend=false && terraform validate
    '''
}

task terraformLint(type: Exec, group: 'verification') {
    description = 'Lint Terraform files using tflint'
    doFirst {
        def tflintPath = exec {
            commandLine 'which', 'tflint'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
        }
        if (tflintPath.exitValue != 0) {
            println "⚠️  tflint not found. Skipping Terraform linting. Install tflint: https://github.com/terraform-linters/tflint#installation"
            // Skip the task by setting a dummy command
            commandLine 'echo', 'tflint not available, skipping'
            return
        }
    }
    commandLine 'sh', '-c', 'find terraform -name ".tflint.hcl" -execdir tflint \\;'
}

task terraformCheck(group: 'verification', description: 'Comprehensive Terraform validation (format, validate, lint)') {
    dependsOn terraformFormatCheck, terraformValidate, terraformLint
}

// Comprehensive linting task that includes Gradle files
// Only depends on shared (non-backend) tasks now
task allLint(group: 'verification', description: 'Run all shared linting checks including Gradle files') {
    dependsOn subprojects.collect { it.path + ':allLint' }
    dependsOn shellCheck, kubeCheck, gradleCheck, terraformCheck
}

task allFormat(group: 'formatting', description: 'Format all shared code including Gradle files') {
    dependsOn subprojects.collect { it.path + ':allFormat' }
    dependsOn gradleFormat, terraformFormat
}
