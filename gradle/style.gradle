configurations {
    ktlint
    detekt
}

dependencies {
    ktlint 'com.pinterest.ktlint:ktlint-cli:1.2.1'
    ktlint 'com.pinterest.ktlint:ktlint-ruleset-standard:1.2.1'

    detekt 'io.gitlab.arturbosch.detekt:detekt-cli:1.23.5'
    detekt 'io.gitlab.arturbosch.detekt:detekt-rules-documentation:1.23.5'
}

// Spotless configuration for code formatting
spotless {
    format('gradle') {
        target '*.gradle', 'gradle/*.gradle'
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    kotlin {
        target 'src/**/*.kt'
        ktlint()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

task ktlint (type: JavaExec, group: 'verification') {
    description = 'Check Kotlin Style.'
    main = 'com.pinterest.ktlint.Main'
    classpath = configurations.ktlint
    args '--color', 'src/**/*.kt'
}
check.dependsOn(ktlint)

task ktlintFormat(type: JavaExec, group: 'formatting') {
    description = 'Fix Kotlin Style.'
    main = 'com.pinterest.ktlint.Main'
    classpath = configurations.ktlint
    args '-F', '--color', 'src/**/*.kt'
}

task detekt(type: JavaExec, group: 'verification') {
    description = 'Run Detekt static analysis on main source code.'
    main = 'io.gitlab.arturbosch.detekt.cli.Main'
    classpath = configurations.detekt
    args '--input', 'src', '--config', 'detekt.yml', '--excludes', 'src/test/**,src/integrationTest/**', '--report', 'txt:build/reports/detekt/detekt.txt', '--report', 'xml:build/reports/detekt/detekt.xml'
}
check.dependsOn(detekt)

task detektTest(type: JavaExec, group: 'verification') {
    description = 'Run Detekt static analysis on test files (unit tests and integration tests) for unused imports only.'
    main = 'io.gitlab.arturbosch.detekt.cli.Main'
    classpath = configurations.detekt
    args '--input', 'src/test,src/integrationTest', '--config', 'detekt-test.yml', '--report', 'txt:build/reports/detekt/detekt-test.txt', '--report', 'xml:build/reports/detekt/detekt-test.xml'
}
check.dependsOn(detektTest)

task kubeval(type: Exec, group: 'verification') {
    description = 'Lint Kubernetes manifests with kubeval'
    commandLine 'sh', '-c', 'kustomize build k8s/overlays/production | kubeval --ignore-missing-schemas'
}

task kubeLinter(type: Exec, group: 'verification') {
    description = 'Lint Kubernetes manifests with kube-linter for all environments'
    commandLine 'sh', '-c', '''
        echo "=== Linting Production Overlay ===" &&
        kustomize build k8s/overlays/production | kube-linter lint - &&
        echo "=== Linting Staging Overlay ===" &&
        kustomize build k8s/overlays/staging | kube-linter lint - &&
        echo "=== Linting Local Overlay (Development) ===" &&
        kustomize build k8s/overlays/local | kube-linter lint --exclude=latest-tag,no-read-only-root-fs -
    '''
}

task kubectlDryRun(type: Exec, group: 'verification') {
    description = 'Validate kustomize output with kubectl dry-run'
    commandLine 'kubectl', 'apply', '--dry-run=client', '-k', 'k8s/overlays/production'
}

task shellCheck(type: Exec, group: 'verification') {
    description = 'Lint all bash scripts with ShellCheck'
    commandLine 'sh', '-c', 'find scripts -name "*.sh" | xargs shellcheck'
}

task kubeCheck(group: 'verification', description: 'Comprehensive Kubernetes linting (kubeval, kube-linter, kubectl dry-run)') {
    dependsOn kubeval, kubeLinter, kubectlDryRun
}

// Gradle-specific linting tasks
// Note: Gradle linting is handled by spotlessCheck via gradleCheck task

task gradleFormat(type: Exec, group: 'formatting') {
    description = 'Format Gradle build files using Spotless'
    commandLine './gradlew', 'spotlessApply'
}

task gradleCheck(type: Exec, group: 'verification') {
    description = 'Check Gradle build files formatting using Spotless'
    commandLine './gradlew', 'spotlessCheck'
}

// Comprehensive linting task that includes Gradle files
task allLint(group: 'verification', description: 'Run all linting checks including Gradle files') {
    dependsOn ktlint, detekt, detektTest, shellCheck, kubeCheck, gradleCheck
}

// Comprehensive formatting task
task allFormat(group: 'formatting', description: 'Format all code including Gradle files') {
    dependsOn ktlintFormat, gradleFormat
}
