// Unified deployment task for all subprojects.
// This will call the prepareDeployment task in each subproject that defines it to prepare for deployment.
// Afterwards, it performs the deployment to Kubernetes.

def environment = project.hasProperty('environment') ? project.getProperty('environment') : 'local'

task setupLocalKubernetes {
    description = 'Setup local Kubernetes environment (minikube, etc.)'
    group = 'kubernetes'
    doFirst {
        println "🔧 Setting up local Kubernetes environment..."
        def minikubeStatus = exec {
            commandLine 'minikube', 'status'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
            errorOutput = new ByteArrayOutputStream()
        }
        if (minikubeStatus.exitValue != 0) {
            println "Starting minikube with local Docker daemon..."
            exec {
                commandLine 'minikube', 'start', '--driver=docker'
                ignoreExitValue = false
            }
        } else {
            println "Minikube is already running"
            println "✅ Minikube is ready for deployment"
        }
        println "Enabling minikube addons..."
        exec {
            commandLine 'minikube', 'addons', 'enable', 'ingress'
            ignoreExitValue = true
        }
        exec {
            commandLine 'minikube', 'addons', 'enable', 'metrics-server'
            ignoreExitValue = true
        }
        sleep(15000)
    }
}

task setupTestPortForward {
    description = 'Setup port forwarding for integration tests'
    group = 'kubernetes'
    doLast {
        println "🔌 Setting up port forwarding for integration tests..."
        exec {
            commandLine 'pkill', '-f', 'kubectl port-forward.*postgres'
            ignoreExitValue = true
        }
        exec {
            commandLine 'sh', '-c', 'nohup kubectl port-forward -n congen service/postgres 5432:5432 > /dev/null 2>&1 & echo $! > /tmp/port-forward.pid'
            ignoreExitValue = true
        }
        println "✅ Port forwarding setup complete (localhost:5432)"
        println "⚠️  Remember to stop port forwarding when done: pkill -f 'kubectl port-forward.*postgres'"
    }
}

task cleanupPortForward {
    description = 'Cleanup port forwarding for integration tests'
    group = 'kubernetes'
    doLast {
        println "🧹 Cleaning up port forwarding..."
        exec {
            commandLine 'pkill', '-f', 'kubectl port-forward.*postgres'
            ignoreExitValue = true
        }
        println "✅ Port forwarding cleaned up"
    }
}

task deployAll {
    group = 'deployment'
    description = 'Prepare and deploy all subprojects to Kubernetes'
    dependsOn subprojects.collect { it.path + ':prepareDeployment' }
    dependsOn ':confirmDeployment'
    if (environment == 'local') {
        dependsOn setupLocalKubernetes
    }
    doLast {
        println "🚀 Deploying all services to Kubernetes..."
        exec {
            commandLine 'kubectl', 'apply', '-k', "k8s/overlays/${environment}"
        }
        // Wait for deployments to be ready (example for backend, can be extended for frontend)
        println "⏳ Waiting for backend deployment to be ready..."
        exec {
            commandLine 'kubectl', 'rollout', 'status', 'deployment/backend', '-n', 'congen', '--timeout=300s'
        }
        println "✅ All deployments complete!"
        println "📊 Check status: kubectl get pods -n congen"
    }
}

task confirmDeployment {
    description = 'Confirm production deployment with user input'
    group = 'kubernetes'
    doLast {
        if (environment == 'production') {
            def response = System.console()?.readLine("Are you sure you want to deploy to production? (y/N): ")
            if (response != 'y' && response != 'Y') {
                throw new GradleException("Production deployment cancelled")
            }
            println "✅ Production deployment confirmed"
        }
    }
}
