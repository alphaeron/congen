// Unified deployment task for all subprojects using staged deployment.
// This integrates with the deploy-staged.sh script for consistent deployment across environments.

def environment = project.hasProperty('environment') ? project.getProperty('environment') : 'local'

// Helper function to build command line arguments for deploy-staged.sh
def buildDeployStagedArgs(stage = null) {
    def args = ['-e', environment]
    
    // Add stage-specific arguments if provided
    if (stage) {
        args += ['--stage', stage]
    }
    
    return args
}

task setupLocalKubernetes {
    description = 'Setup local Kubernetes environment (minikube, etc.)'
    group = 'kubernetes'
    doFirst {
        println "🔧 Setting up local Kubernetes environment..."
        def minikubeStatus = exec {
            commandLine 'minikube', 'status'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
            errorOutput = new ByteArrayOutputStream()
        }
        if (minikubeStatus.exitValue != 0) {
            println "Starting minikube with local Docker daemon..."
            exec {
                commandLine 'minikube', 'start', '--driver=docker'
                ignoreExitValue = false
            }
        } else {
            println "Minikube is already running"
            println "✅ Minikube is ready for deployment"
        }
        println "Enabling minikube addons..."
        exec {
            commandLine 'minikube', 'addons', 'enable', 'ingress'
            ignoreExitValue = true
        }
        exec {
            commandLine 'minikube', 'addons', 'enable', 'metrics-server'
            ignoreExitValue = true
        }
        sleep(15000)
    }
}

task setupTestPortForward {
    description = 'Setup port forwarding for integration tests'
    group = 'kubernetes'
    doLast {
        println "🔌 Setting up port forwarding for integration tests..."
        exec {
            commandLine 'pkill', '-f', 'kubectl port-forward.*postgres'
            ignoreExitValue = true
        }
        exec {
            commandLine 'sh', '-c', 'nohup kubectl port-forward -n congen service/postgres 5432:5432 > /dev/null 2>&1 & echo $! > /tmp/port-forward.pid'
            ignoreExitValue = true
        }
        println "✅ Port forwarding setup complete (localhost:5432)"
        println "⚠️  Remember to stop port forwarding when done: pkill -f 'kubectl port-forward.*postgres'"
    }
}

task cleanupPortForward {
    description = 'Cleanup port forwarding for integration tests'
    group = 'kubernetes'
    doLast {
        println "🧹 Cleaning up port forwarding..."
        exec {
            commandLine 'pkill', '-f', 'kubectl port-forward.*postgres'
            ignoreExitValue = true
        }
        println "✅ Port forwarding cleaned up"
    }
}

// Unified stage deployment task
task deployStage {
    group = 'deployment'
    description = 'Deploy a specific stage (1-6)'
    
    // Validate stage parameter
    doFirst {
        if (!project.hasProperty('stage')) {
            throw new GradleException("Stage parameter is required. Use: -Pstage=<1-6>")
        }
        
        def stageNum = project.getProperty('stage') as Integer
        if (stageNum < 1 || stageNum > 6) {
            throw new GradleException("Invalid stage: ${stageNum}. Must be 1, 2, 3, 4, 5, or 6.")
        }
        
        // Check if Stage 6 is being deployed to local environment
        if (stageNum == 6 && environment == 'local') {
            throw new GradleException("Stage 6 (Ingress) is not applicable for local environment")
        }
    }
    
    dependsOn subprojects.collect { it.path + ':prepareDeployment' }
    if (environment == 'local') {
        dependsOn setupLocalKubernetes
    }
    
    doLast {
        def stageNum = project.getProperty('stage') as Integer
        def stageDescriptions = [
            1: "Infrastructure",
            2: "Secrets Bootstrapping",
            3: "Keycloak Infrastructure", 
            4: "Terraform and Secrets Update",
            5: "Application Components",
            6: "Ingress"
        ]
        
        println "🚀 Deploying Stage ${stageNum}: ${stageDescriptions[stageNum]} for environment: ${environment}"
        def args = buildDeployStagedArgs(stageNum.toString())
        def cmdLine = ['scripts/deploy-staged.sh'] + args
        exec {
            commandLine cmdLine
        }
        println "✅ Stage ${stageNum} deployment complete!"
    }
}

// Main deployment task using staged deployment
task deployAll {
    group = 'deployment'
    description = 'Prepare and deploy all subprojects to Kubernetes using staged deployment'
    dependsOn subprojects.collect { it.path + ':prepareDeployment' }
    dependsOn ':confirmDeployment'
    if (environment == 'local') {
        dependsOn setupLocalKubernetes
    }
    doLast {
        println "🚀 Starting staged deployment for environment: ${environment}"
        
        // Deploy all stages in sequence
        def stages = [1, 2, 3, 4, 5]
        if (environment != 'local') {
            stages << 6  // Add Stage 6 for staging/production
        }
        
        stages.each { stageNum ->
            println "📋 Deploying Stage ${stageNum}..."
            def stageArgs = buildDeployStagedArgs(stageNum.toString())
            def stageCmdLine = ['scripts/deploy-staged.sh'] + stageArgs
            exec {
                commandLine stageCmdLine
            }
            println "✅ Stage ${stageNum} complete!"
        }
        
        println "🎉 All stages deployed successfully!"
    }
}

task confirmDeployment {
    description = 'Confirm production deployment with user input'
    group = 'kubernetes'
    doLast {
        if (environment == 'production') {
            def response = System.console()?.readLine("Are you sure you want to deploy to production? (y/N): ")
            if (response != 'y' && response != 'Y') {
                throw new GradleException("Production deployment cancelled")
            }
            println "✅ Production deployment confirmed"
        }
    }
}
