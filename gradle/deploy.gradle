// Unified deployment task for all subprojects using staged deployment.
// This integrates with the deploy-staged.sh script for consistent deployment across environments.

ext.environment = project.hasProperty('environment') ? project.getProperty('environment') : 'local'

// Helper function to build command line arguments for deploy-staged.sh
def buildDeployStagedArgs(stage = null) {
    def environment = project.hasProperty('environment') ? project.getProperty('environment') : 'local'
    def args = ['-e', environment]
    
    // Add mount directory for local-persist environment
    if (environment == 'local-persist' && project.hasProperty('mountDir')) {
        args += ['-m', project.getProperty('mountDir')]
    }
    
    // Add stage-specific arguments if provided
    if (stage) {
        args += ['--stage', stage]
    }
    
    return args
}

task setupLocalKubernetes {
    description = 'Setup local Kubernetes environment (minikube, etc.)'
    group = 'kubernetes'
    doFirst {
        println "🔧 Setting up local Kubernetes environment..."
        def minikubeStatus = exec {
            commandLine 'minikube', 'status'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
            errorOutput = new ByteArrayOutputStream()
        }
        if (minikubeStatus.exitValue != 0) {
            println "Starting minikube with local Docker daemon..."
            exec {
                commandLine 'minikube', 'start', '--driver=docker'
                ignoreExitValue = false
            }
        } else {
            println "Minikube is already running"
            println "✅ Minikube is ready for deployment"
        }
        println "Enabling minikube addons..."
        exec {
            commandLine 'minikube', 'addons', 'enable', 'ingress'
            ignoreExitValue = true
        }
        exec {
            commandLine 'minikube', 'addons', 'enable', 'metrics-server'
            ignoreExitValue = true
        }
        sleep(15000)
    }
}

task loadThirdPartyImagesIntoMinikube {
    description = 'Load third-party Docker images into minikube for local deployments'
    group = 'kubernetes'
    mustRunAfter setupLocalKubernetes
    
    doFirst {
        def environment = project.hasProperty('environment') ? project.getProperty('environment') : 'local'
        if (environment != 'local' && environment != 'local-persist') {
            println "⏭️  Skipping third-party image loading for non-local environment: ${environment}"
            return
        }
        
        println "📦 Loading third-party images into minikube for ${environment} environment..."
        
        def images = [
            'postgres:15-alpine',
            'postgres:15',
            'memcached:1.6.39-alpine',
            'sfat/liquibase:4.11.0',
            'mirror.gcr.io/busybox:1.35',
            'quay.io/keycloak/keycloak:26.3.2',
            'stakater/reloader:v1.0.46'
        ]
        
        images.each { image ->
            println "  Loading ${image}..."
            def output = new ByteArrayOutputStream()
            def result = exec {
                commandLine 'docker', 'images', '-q', image
                ignoreExitValue = true
                standardOutput = output
            }
            
            if (result.exitValue == 0 && output.toString().trim()) {
                exec {
                    commandLine 'minikube', 'image', 'load', image
                    ignoreExitValue = false
                }
                println "  ✅ Loaded ${image} into minikube"
            } else {
                println "  ⚠️  Image ${image} not found locally, skipping. Run getimages.sh first to pull images."
            }
        }
        
        println "✅ Third-party image loading complete"
    }
}

task setupTestPortForward {
    description = 'Setup port forwarding for integration tests'
    group = 'kubernetes'
    doLast {
        println "🔌 Setting up port forwarding for integration tests..."
        exec {
            commandLine 'pkill', '-f', 'kubectl port-forward.*postgres'
            ignoreExitValue = true
        }
        exec {
            commandLine 'sh', '-c', 'nohup kubectl port-forward -n congen service/postgres 5432:5432 > /dev/null 2>&1 & echo $! > /tmp/port-forward.pid'
            ignoreExitValue = true
        }
        println "✅ Port forwarding setup complete (localhost:5432)"
        println "⚠️  Remember to stop port forwarding when done: pkill -f 'kubectl port-forward.*postgres'"
    }
}

task cleanupPortForward {
    description = 'Cleanup port forwarding for integration tests'
    group = 'kubernetes'
    doLast {
        println "🧹 Cleaning up port forwarding..."
        exec {
            commandLine 'pkill', '-f', 'kubectl port-forward.*postgres'
            ignoreExitValue = true
        }
        println "✅ Port forwarding cleaned up"
    }
}

task cleanupLocalKubernetes {
    description = 'Cleanup local Kubernetes environment (stop minikube)'
    group = 'kubernetes'
    doLast {
        println "🧹 Cleaning up local Kubernetes environment..."
        def minikubeStatus = exec {
            commandLine 'minikube', 'status'
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
            errorOutput = new ByteArrayOutputStream()
        }
        if (minikubeStatus.exitValue == 0) {
            println "Stopping minikube..."
            exec {
                commandLine 'minikube', 'stop'
                ignoreExitValue = true
            }
            println "✅ Minikube stopped"
        } else {
            println "Minikube is not running, nothing to clean up"
        }
        println "✅ Local Kubernetes environment cleaned up"
    }
}

// Unified stage deployment task
task deployStage {
    group = 'deployment'
    description = 'Deploy a specific stage (1-10)'
    
    // Validate stage parameter
    doFirst {
        if (!project.hasProperty('stage')) {
            throw new GradleException("Stage parameter is required. Use: -Pstage=<1-10>")
        }
        
        def stageNum = project.getProperty('stage') as Integer
        if (stageNum < 1 || stageNum > 10) {
            throw new GradleException("Invalid stage: ${stageNum}. Must be between 1 and 10.")
        }
        
        // Check if Stage 10 is being deployed to local environment
        if (stageNum == 10 && (project.hasProperty('environment') && (project.getProperty('environment') == 'local' || project.getProperty('environment') == 'local-persist'))) {
            throw new GradleException("Stage ${stageNum} is not applicable for local environment")
        }
    }

    doLast {
        def stageNum = project.getProperty('stage') as Integer
        def stageDescriptions = [
            1: "Namespace",
            2: "Service Account",
            3: "Infrastructure",
            4: "Secrets",
            5: "Database Migrations",
            6: "Keycloak",
            7: "Terraform and Secrets Update",
            8: "Application",
            9: "Networking",
            10: "Horizontal Pod Autoscaler",
        ]
        
        def environment = project.hasProperty('environment') ? project.getProperty('environment') : 'local'
        println "🚀 Deploying Stage ${stageNum}: ${stageDescriptions[stageNum]} for environment: ${environment}"
        def args = buildDeployStagedArgs(stageNum.toString())
        def cmdLine = ['scripts/deploy-staged.sh'] + args
        exec {
            commandLine cmdLine
        }
        println "✅ Stage ${stageNum} deployment complete!"
    }
}

// Main deployment task using staged deployment
task deployAll {
    group = 'deployment'
    description = 'Prepare and deploy all subprojects to Kubernetes using staged deployment'
    
    inputs.property("environment", project.hasProperty('environment') ? project.getProperty('environment') : 'local')
    inputs.property("timestamp", { System.currentTimeMillis() })
    outputs.file("${buildDir}/deployAll.timestamp")
    
    // Force task to always run
    outputs.upToDateWhen { false }
    
    // Force task to always run
    if (project.hasProperty('environment') && (project.getProperty('environment') == 'local' || project.getProperty('environment') == 'local-persist')) {
        dependsOn setupLocalKubernetes
        dependsOn loadThirdPartyImagesIntoMinikube
    }
    dependsOn ':confirmDeployment'
    
    doFirst {
        def environment = project.hasProperty('environment') ? project.getProperty('environment') : 'local'
        println "🚀 Starting staged deployment for environment: ${environment}"
    }
    
    doLast {
        // Create timestamp file to mark task completion
        file("${buildDir}/deployAll.timestamp").text = System.currentTimeMillis().toString()
        
        println "🎉 All stages deployed successfully!"
        
        // Deploy all stages in sequence
        def stages = [1, 2, 3, 4, 5, 6, 7, 8, 9]
        if (project.hasProperty('environment') && project.getProperty('environment') != 'local' && project.getProperty('environment') != 'local-persist') {
            stages << 10  // Add Stage 10 for staging/production
        }
        
        stages.each { stageNum ->
            println "📋 Deploying Stage ${stageNum}..."
            def stageArgs = buildDeployStagedArgs(stageNum.toString())
            def stageCmdLine = ['scripts/deploy-staged.sh'] + stageArgs
            exec {
                commandLine stageCmdLine
            }
            println "✅ Stage ${stageNum} complete!"
        }
        
        println "🎉 All stages deployed successfully!"
    }
}

task confirmDeployment {
    description = 'Confirm production deployment with user input'
    group = 'kubernetes'
    doLast {
        if (project.hasProperty('environment') && project.getProperty('environment') == 'production') {
            def response = System.console()?.readLine("Are you sure you want to deploy to production? (y/N): ")
            if (response != 'y' && response != 'Y') {
                throw new GradleException("Production deployment cancelled")
            }
            println "✅ Production deployment confirmed"
        }
    }
}

// Configure deployAll task dependencies after all tasks are available
deployAll.configure {
    dependsOn subprojects.collect { it.path + ':prepareDeployment' }
}

// Configure deployStage task dependencies after all tasks are available
deployStage.configure {
    dependsOn subprojects.collect { it.path + ':prepareDeployment' }
    if (project.hasProperty('environment') && (project.getProperty('environment') == 'local' || project.getProperty('environment') == 'local-persist')) {
        dependsOn setupLocalKubernetes
        dependsOn loadThirdPartyImagesIntoMinikube
    }
}
