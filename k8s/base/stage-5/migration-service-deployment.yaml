apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-service
  namespace: congen
  labels:
    app: migration-service
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1  # Singleton - only one instance
  selector:
    matchLabels:
      app: migration-service
  template:
    metadata:
      labels:
        app: migration-service
    spec:
      serviceAccountName: congen-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: migration-service
        image: sfat/liquibase:4.11.0
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGWRITERHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGPASSWORD
        - name: MIGRATION_INTERVAL
          value: "300"  # Check for migrations every 5 minutes
        - name: MIGRATION_LABELS
          value: "test"  # Default to test labels
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB_USERNAME
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB_PASSWORD
        volumeMounts:
        - name: migrations
          mountPath: /liquibase/changelog
        - name: tmp
          mountPath: /tmp
        command:
        - bash
        - -xc
        - |
          copy_data_migration_file() {
            local file="$1"
            local filename
            local rest
            local dest
            filename=$(basename "$file")
            rest="${filename#data_}"
            if [ "${rest#changelog-}" != "$rest" ]; then
              dest="/tmp/liquibase/data/$rest"
            elif [ "${rest#equipment_}" != "$rest" ]; then
              dest="/tmp/liquibase/data/equipment/${rest#equipment_}"
            elif [ "${rest#muscle_}" != "$rest" ]; then
              dest="/tmp/liquibase/data/muscle/${rest#muscle_}"
            elif [ "${rest#exercises_}" != "$rest" ]; then
              dest="/tmp/liquibase/data/exercises/${rest#exercises_}"
            else
              dest="/tmp/liquibase/data/$rest"
            fi
            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"
          }

          copy_migrations_to_tmp() {
            mkdir -p /tmp/liquibase/schema /tmp/liquibase/data/equipment /tmp/liquibase/data/muscle /tmp/liquibase/data/exercises
            cp /liquibase/changelog/liquibase.properties /tmp/liquibase/
            cp /liquibase/changelog/changelog-root.xml /tmp/liquibase/
            for file in /liquibase/changelog/schema_*.sql; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                cp "$file" "/tmp/liquibase/schema/${filename#schema_}"
              fi
            done
            for file in /liquibase/changelog/data_*.sql; do
              if [ -f "$file" ]; then
                copy_data_migration_file "$file"
              fi
            done
          }

          run_migrations() {
            echo "Starting migration process..."
            echo "Copying Liquibase files from ConfigMap..."
            copy_migrations_to_tmp
            echo "All files copied. Listing directory structure:"
            find /tmp/liquibase -type f -name "*.sql" | sort

            # Construct JDBC URL from secret values
            export DB="jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}"

            # Run Liquibase migrations from the writable location
            cd /tmp/liquibase
            echo "Running Liquibase validate..."
            if ! liquibase --changelogFile=changelog-root.xml --url=$DB --username=$PGUSER --password=$PGPASSWORD validate; then
              echo "Liquibase validation failed!"
              return 1
            fi
            echo "Running Liquibase update..."
            if ! liquibase --changelogFile=changelog-root.xml --url=$DB --username=$PGUSER --password=$PGPASSWORD --labels="$MIGRATION_LABELS" update; then
              echo "Liquibase update failed!"
              return 1
            fi
            echo "Liquibase migration completed successfully!"
            return 0
          }

          # Function to check if migrations are needed
          check_migrations() {
            echo "Checking if migrations are needed..."
            copy_migrations_to_tmp

            # Construct JDBC URL from secret values
            export DB="jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}"

            # Check if migrations are needed
            cd /tmp/liquibase
            if liquibase --changelogFile=changelog-root.xml --url=$DB --username=$PGUSER --password=$PGPASSWORD status | grep -q "is up to date"; then
              echo "Database is up to date, no migrations needed"
              return 1
            else
              echo "Migrations are needed"
              return 0
            fi
          }

          # Run initial migration
          echo "Running initial migration check..."
          if check_migrations; then
            run_migrations
          fi

          # Continuous monitoring loop
          echo "Starting continuous migration monitoring..."
          while true; do
            sleep $MIGRATION_INTERVAL

            echo "Checking for new migrations..."
            if check_migrations; then
              echo "New migrations detected, running them..."
              run_migrations
            else
              echo "No new migrations detected"
            fi
          done
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      volumes:
      - name: migrations
        configMap:
          name: migrations-config
      - name: tmp
        emptyDir: {}
