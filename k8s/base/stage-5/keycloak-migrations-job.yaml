apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-migrations
  namespace: congen
  labels:
    app: keycloak-migrations
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: keycloak-migrations
    spec:
      serviceAccountName: congen-service-account
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: keycloak-migrations
        image: postgres:15
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
        env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGPASSWORD
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB_USERNAME
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB_PASSWORD
        command:
        - bash
        - -xc
        - |
          echo "Starting Keycloak database setup..."
          
          # Create the Keycloak database and user using psql
          echo "Creating Keycloak database and user..."
          
          # Check if database exists and create it if it doesn't
          DB_EXISTS=$(psql -h $PGHOST -p $PGPORT -U $PGUSER -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$KC_DB_USERNAME'")
          if [ -z "$DB_EXISTS" ]; then
            echo "Creating database $KC_DB_USERNAME..."
            psql -h $PGHOST -p $PGPORT -U $PGUSER -d postgres -c "CREATE DATABASE \"$KC_DB_USERNAME\";"
          else
            echo "Database $KC_DB_USERNAME already exists."
          fi
          
          # Check if user exists and create it if it doesn't
          USER_EXISTS=$(psql -h $PGHOST -p $PGPORT -U $PGUSER -d postgres -tAc "SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '$KC_DB_USERNAME'")
          if [ -z "$USER_EXISTS" ]; then
            echo "Creating user $KC_DB_USERNAME..."
            psql -h $PGHOST -p $PGPORT -U $PGUSER -d postgres -c "CREATE USER \"$KC_DB_USERNAME\" WITH PASSWORD '$KC_DB_PASSWORD';"
          else
            echo "User $KC_DB_USERNAME already exists."
          fi
          
          # Grant privileges
          echo "Granting privileges..."
          psql -h $PGHOST -p $PGPORT -U $PGUSER -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE \"$KC_DB_USERNAME\" TO \"$KC_DB_USERNAME\";"
          
          # Connect to the Keycloak database and grant schema privileges
          echo "Setting up schema privileges..."
          psql -h $PGHOST -p $PGPORT -U $PGUSER -d "$KC_DB_USERNAME" -c "
            GRANT ALL ON SCHEMA public TO \"$KC_DB_USERNAME\";
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"$KC_DB_USERNAME\";
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO \"$KC_DB_USERNAME\";
            GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO \"$KC_DB_USERNAME\";
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO \"$KC_DB_USERNAME\";
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO \"$KC_DB_USERNAME\";
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO \"$KC_DB_USERNAME\";
          "
          
          echo "Keycloak database setup completed successfully!"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
