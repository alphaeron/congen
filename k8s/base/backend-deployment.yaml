apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: congen
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: congen-secret
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: PGWRITERHOST
          value: "postgres"
        - name: PGREADERHOST
          value: "postgres"
        - name: PGPORT
          value: "5432"
        livenessProbe:
          httpGet:
            path: /api/v1/health/
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/v1/health/
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: tmp
        emptyDir: {} 