apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: congen
type: Opaque
data:
  # Dummy values - will be updated by deployment script with actual values from Terraform
  # Note: admin_password must match the password in terraform.tfvars and the actual Keycloak user password
  KC_BOOTSTRAP_ADMIN_USERNAME: YWRtaW5AY29uZ2VuLmNvbQ==  # admin@congen.com
  KC_BOOTSTRAP_ADMIN_PASSWORD: ZHVtbXktYWRtaW4tcGFzc3dvcmQ=  # dummy-admin-password (update to match terraform.tfvars)
  KC_DB_USERNAME: ZHVtbXktZGItdXNlcg==  # dummy-db-user
  KC_DB_PASSWORD: ZHVtbXktZGItcGFzc3dvcmQ=  # dummy-db-password
  KC_DB: cG9zdGdyZXM=  # postgres
  KC_DB_URL: amRiYzpwb3N0Z3Jlc3FsOi8vcG9zdGdyZXM6NTQzMi9rZXljbG9haw==  # jdbc:postgresql://postgres:5432/keycloak
  CONGEN_BACKEND_CLIENT_SECRET: ZHVtbXktY2xpZW50LXNlY3JldA==  # dummy-client-secret
  CONGEN_SERVICE_ACCOUNT_USERNAME: ZHVtbXktc2VydmljZS1hY2NvdW50  # dummy-service-account
  CONGEN_SERVICE_ACCOUNT_PASSWORD: ZHVtbXktc2VydmljZS1hY2NvdW50LXBhc3N3b3Jk  # dummy-service-account-password 