apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Common resources that are shared across all environments
resources:
# Infrastructure
- namespace.yaml

# Keycloak
- keycloak-deployment.yaml
- keycloak-service.yaml

# Application Components
- service-account.yaml
- reloader-rbac.yaml
- migrations-configmap.yaml
- migration-service-deployment.yaml
- reloader-deployment.yaml
- backend-configmap.yaml
- backend-deployment.yaml
- backend-service.yaml
- frontend-deployment.yaml
- frontend-service.yaml
- network-policy.yaml

# Secrets (with dummy values - updated by deployment script)
- congen-secret.yaml
- keycloak-secret.yaml 