apiVersion: batch/v1
kind: Job
metadata:
  name: liquibase-migration
  namespace: congen
spec:
  template:
    spec:
      containers:
      - name: liquibase
        image: sfat/liquibase:4.11.0
        env:
        - name: DB_BASE_URL
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: DB_BASE_URL
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: congen-secret
              key: PGPASSWORD
        volumeMounts:
        - name: migrations
          mountPath: /liquibase/changelog
        - name: tmp
          mountPath: /tmp
        command:
        - bash
        - -xc
        - |
          # Create writable directory structure in /tmp
          mkdir -p /tmp/liquibase/schema /tmp/liquibase/data
          
          # Copy files from ConfigMap to writable location
          cp /liquibase/changelog/liquibase.properties /tmp/liquibase/
          cp /liquibase/changelog/changelog-root.xml /tmp/liquibase/
          
          # Copy schema files (remove schema_ prefix)
          for file in /liquibase/changelog/schema_*.sql; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              cp "$file" "/tmp/liquibase/schema/${filename#schema_}"
            fi
          done
          
          # Copy data files (remove data_ prefix)
          for file in /liquibase/changelog/data_*.sql; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              cp "$file" "/tmp/liquibase/data/${filename#data_}"
            fi
          done
          
          # Construct JDBC URL from secret values
          export DB="${DB_BASE_URL}${PGHOST}:${PGPORT}/${PGDATABASE}"
          
          # Run Liquibase migrations from the writable location
          cd /tmp/liquibase
          liquibase --changelogFile=changelog-root.xml --url=$DB --username=$PGUSER --password=$PGPASSWORD validate &&
          liquibase --changelogFile=changelog-root.xml --url=$DB --username=$PGUSER --password=$PGPASSWORD --labels="test" update &&
          sleep 5
      volumes:
      - name: migrations
        configMap:
          name: migrations-config
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
  backoffLimit: 3 