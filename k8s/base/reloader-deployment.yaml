apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader
  namespace: congen
  labels:
    app: reloader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reloader
  template:
    metadata:
      labels:
        app: reloader
    spec:
      serviceAccountName: congen-service-account
      containers:
      - name: reloader
        image: stakater/reloader:v1.0.46
        args:
        - --auto-annotation=reloader.stakater.com/auto
        env:
        - name: KUBERNETES_NAMESPACE
          value: congen
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m" 