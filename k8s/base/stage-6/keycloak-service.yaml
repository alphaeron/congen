apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: congen
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: management
  type: ClusterIP
