apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme
  namespace: congen
data:
  # Theme properties file
  "theme.properties": |
    parent=keycloak
    import=common/keycloak
    styles=css/congen.css
  
  # Favicon - Congen icon (SVG format)
