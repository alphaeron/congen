apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme
  namespace: congen
data:
  # Theme properties file
  "theme.properties": |
    parent=keycloak
    import=common/keycloak
    styles=css/congen.css
  
  # CSS with light/dark mode support matching TypeScript app theme
  "css-congen.css": |
    /* CSS Variables for light/dark mode matching TypeScript app */
    :root {
      /* Light mode colors from theme.tsx */
      --background-color: #f9fafc;
      --text-color: #202020;
      --text-secondary: #55585e;
      --link-color: #2236cc;
      --button-color: #2236cc;
      --button-hover-color: #1b2a9e;
      --card-background: #ffffff;
      --card-border: #e2e8f0;
      --form-background: #ffffff;
      --form-border: #c8ccd2;
      --form-border-focus: #2236cc;
      --form-shadow: rgba(0, 0, 0, 0.1);
    }
    
    /* Dark mode colors from theme.tsx */
    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: #202020;
        --text-color: #ffffff;
        --text-secondary: #a2a6ad;
        --link-color: #7a9cf0;
        --button-color: #4d6fe0;
        --button-hover-color: #2236cc;
        --card-background: #28292c;
        --card-border: #4a5568;
        --form-background: #28292c;
        --form-border: #4a5568;
        --form-border-focus: #4d6fe0;
        --form-shadow: rgba(0, 0, 0, 0.4);
      }
    }
    
    /* Smooth transitions */
    * {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    
    /* Remove background images and set proper background */
    body {
      background-color: var(--background-color) !important;
      background-image: none !important;
      color: var(--text-color) !important;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    
    /* Remove background images from login page */
    .login-pf body {
      background-color: var(--background-color) !important;
      background-image: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    /* Remove background images from all containers */
    .login-pf,
    .login-pf .container,
    .login-pf .container-fluid {
      background-color: var(--background-color) !important;
      background-image: none !important;
    }
    
    /* Style the login card with proper background and rounded corners */
    .card-pf {
      background-color: var(--card-background) !important;
      background-image: none !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 10px !important;
      box-shadow: 0 4px 16px var(--form-shadow) !important;
      padding: 2rem !important;
      max-width: 400px !important;
      width: 100% !important;
    }
    
    /* Ensure form text is visible */
    .card-pf-heading,
    .card-pf-body,
    .form-group label,
    .help-block,
    .text-muted,
    .control-label {
      color: var(--text-color) !important;
    }
    
    /* Style form inputs with rounded corners and proper colors */
    .form-control {
      background-color: var(--form-background) !important;
      border: 1px solid var(--form-border) !important;
      border-radius: 10px !important;
      color: var(--text-color) !important;
      padding: 12px 16px !important;
      font-size: 14px !important;
      transition: border-color 0.3s ease, box-shadow 0.3s ease !important;
    }
    
    .form-control:focus {
      outline: none !important;
      border-color: var(--form-border-focus) !important;
      box-shadow: 0 0 0 4px rgba(34, 54, 204, 0.1) !important;
      background-color: var(--form-background) !important;
      color: var(--text-color) !important;
    }
    
    .form-control::placeholder {
      color: var(--text-secondary) !important;
    }
    
    /* Style buttons with rounded corners and proper colors */
    .btn-primary {
      background: linear-gradient(to bottom, #4d6fe0, #1b2a9e) !important;
      color: #f0f4ff !important;
      border: 1px solid #16227a !important;
      border-radius: 10px !important;
      padding: 12px 24px !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      cursor: pointer !important;
      transition: all 0.3s ease !important;
      text-transform: none !important;
      box-shadow: inset 0 1px rgba(122, 156, 240, 0.4) !important;
    }
    
    .btn-primary:hover {
      background: #4d6fe0 !important;
      box-shadow: 0 0 0 1px rgba(122, 156, 240, 0.5) !important;
    }
    
    .btn-primary:active {
      transform: scale(0.98) !important;
    }
    
    /* Style links */
    a {
      color: var(--link-color) !important;
      text-decoration: none !important;
      font-weight: 500 !important;
      transition: color 0.3s ease !important;
    }
    
    a:hover {
      color: var(--button-hover-color) !important;
    }
    
    /* Style alert messages */
    .alert {
      padding: 12px 16px !important;
      border-radius: 8px !important;
      margin-bottom: 1rem !important;
      font-size: 14px !important;
      color: var(--text-color) !important;
    }
    
    .alert-error {
      background-color: rgba(211, 47, 47, 0.1) !important;
      border: 1px solid rgba(211, 47, 47, 0.3) !important;
      color: #d32f2f !important;
    }
    
    .alert-warning {
      background-color: rgba(247, 181, 56, 0.1) !important;
      border: 1px solid rgba(247, 181, 56, 0.3) !important;
      color: #f7b538 !important;
    }
    
    .alert-info {
      background-color: rgba(34, 54, 204, 0.1) !important;
      border: 1px solid rgba(34, 54, 204, 0.3) !important;
      color: var(--link-color) !important;
    }
    
    /* Dark mode specific adjustments */
    @media (prefers-color-scheme: dark) {
      .btn-primary {
        background: linear-gradient(to bottom, #4d6fe0, #2236cc) !important;
        border-color: #16227a !important;
        box-shadow: inset 0 1px rgba(122, 156, 240, 0.4) !important;
      }
      
      .btn-primary:hover {
        background: #2236cc !important;
        box-shadow: 0 0 0 1px rgba(122, 156, 240, 0.5) !important;
      }
      
      .alert-error {
        background-color: rgba(211, 47, 47, 0.2) !important;
        border-color: rgba(211, 47, 47, 0.4) !important;
      }
      
      .alert-warning {
        background-color: rgba(247, 181, 56, 0.2) !important;
        border-color: rgba(247, 181, 56, 0.4) !important;
      }
      
      .alert-info {
        background-color: rgba(122, 156, 240, 0.2) !important;
        border-color: rgba(122, 156, 240, 0.4) !important;
      }
    } 