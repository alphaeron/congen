apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: congen
  labels:
    app: keycloak
  annotations:
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/search: "keycloak-theme"
spec:
  serviceName: keycloak-discovery
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
      - name: theme-setup
        image: keycloak-theme:latest
        command: ['sh', '-c']
        args:
        - |
          # Clean up any existing theme structure
          rm -rf /opt/keycloak/themes/congen*
          # Create proper theme structure for login theme (existing CSS-based)
          mkdir -p /opt/keycloak/themes/congen/login/resources/css
          mkdir -p /opt/keycloak/themes/congen/login/img
          # Copy theme files to login theme directory
          cp /tmp/theme/login-theme.properties /opt/keycloak/themes/congen/login/theme.properties
          cp /tmp/theme/css-congen.css /opt/keycloak/themes/congen/login/resources/css/congen.css
          # Create resources/img directory for favicon override
          mkdir -p /opt/keycloak/themes/congen/login/resources/img
          # Base64 decode the favicon to override the common theme favicon
          base64 -d /tmp/theme/favicon.ico > /opt/keycloak/themes/congen/login/resources/img/favicon.ico
          # Extract account theme JAR from the Docker image
          echo "=== Extracting Congen Account Theme JAR ==="
          cd /opt/keycloak/themes
          unzip -o /theme/congen-account-theme.jar
          # Set proper permissions
          chmod -R 755 /opt/keycloak/themes/congen-account-theme
          echo "=== Account Theme JAR extracted successfully ==="
          ls -la /opt/keycloak/themes/congen-account-theme/
          # Set proper permissions
          chmod -R 755 /opt/keycloak/themes/
          # Debug: List the created files
          echo "=== Theme files created ==="
          find /opt/keycloak/themes/ -name "*congen*" -type f -exec ls -la {} \;
          echo "=== Theme directory structure ==="
          find /opt/keycloak/themes/ -name "*congen*" -type d | sort
        volumeMounts:
        - name: keycloak-theme
          mountPath: /tmp/theme
        - name: keycloak-theme-volume
          mountPath: /opt/keycloak/themes
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.3.2
        command: ["/opt/keycloak/bin/kc.sh"]
        ports:
        - containerPort: 8080
        - containerPort: 9000
        volumeMounts:
        - name: keycloak-theme-volume
          mountPath: /opt/keycloak/themes
        env:
        # In a production environment, add a TLS certificate to Keycloak to either end-to-end encrypt the traffic between
        # the client or Keycloak, or to encrypt the traffic between your proxy and Keycloak.
        # Respect the proxy headers forwarded by the reverse proxy
        # In a production environment, verify which proxy type you are using, and restrict access to Keycloak
        # from other sources than your proxy if you continue to use proxy headers.
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        - name: KC_HTTP_ENABLED
          value: "true"
        # In this explorative setup, no strict hostname is set.
        # For production environments, set a hostname for a secure setup.
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: 'KC_CACHE'
          value: 'ispn'
        # Use the Kubernetes configuration for distributed caches which is based on DNS
        - name: 'KC_CACHE_STACK'
          value: 'kubernetes'
        # Passing the Pod's IP primary address to the JGroups clustering as this is required in IPv6 only setups
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # Instruct JGroups which DNS hostname to use to discover other Keycloak nodes
        # Needs to be unique for each Keycloak cluster
        - name: JAVA_OPTS_APPEND
          value: '-Djgroups.dns.query="keycloak-discovery" -Djgroups.bind.address=$(POD_IP)'
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_BOOTSTRAP_ADMIN_USERNAME
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB_USERNAME
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB_PASSWORD
        - name: KC_DB
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB
        - name: KC_DB_URL
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB_URL
        resources:
          limits:
            cpu: 2000m
            memory: 2000Mi
          requests:
            cpu: 500m
            memory: 1700Mi
        startupProbe:
          httpGet:
            path: /health/started
            port: 9000
          periodSeconds: 1
          failureThreshold: 600
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9000
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: keycloak-theme
        configMap:
          name: keycloak-theme
      - name: keycloak-theme-volume
        emptyDir: {}
