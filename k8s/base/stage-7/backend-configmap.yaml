apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: backend
data:
  SPRING_PROFILES_ACTIVE: "local"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8888"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Requested-With,Accept,Accept-Language,Cache-Control,If-Modified-Since,If-None-Match,Origin,Referer,User-Agent"
  CORS_EXPOSED_HEADERS: "Content-Type,Content-Range"
  CORS_MAX_AGE: "86400"
  PGSSLMODE: "false"
  SPRINGDOC_API_DOCS_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_PATH: "/swagger-ui.html"
  SPRINGDOC_API_DOCS_PATH: "/api-docs"
  SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER: "method"
  SPRINGDOC_SWAGGER_UI_TAGS_SORTER: "alpha"
  SPRINGDOC_SWAGGER_UI_DOC_EXPANSION: "none"
  SPRINGDOC_SWAGGER_UI_DISPLAY_REQUEST_DURATION: "true"
  SPRINGDOC_SWAGGER_UI_FILTER: "true"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "congen"
  KEYCLOAK_AUTH_URL: "http://keycloak:8080/auth/"
  KEYCLOAK_CLIENT_ID: "congen-backend"
  KEYCLOAK_SERVICE_ACCOUNT_USERNAME: "service-account-congen-backend"
  CONGEN_KEYCLOAK_MANAGEMENT_URL: "http://keycloak:9000"
  # JWT Configuration with dummy defaults
  JWT_ISSUER_URI: "http://keycloak:8080/realms/congen"
  JWT_JWK_SET_URI: "http://keycloak:8080/realms/congen/protocol/openid-connect/certs"
  JWT_AUDIENCES: "congen-backend"
  # Memcached Configuration
  MEMCACHED_HOST: "memcached"
  MEMCACHED_PORT: "11211"
  MEMCACHED_CONNECTION_POOL_SIZE: "10"
  MEMCACHED_OP_TIMEOUT: "1000"
  MEMCACHED_MAX_QUEUED_NOREPLY: "1000"
  MEMCACHED_SCHEDULER_THREAD_POOL_SIZE: "15"
  MEMCACHED_SCHEDULER_QUEUE_CAPACITY: "1000"
  MEMCACHED_SCHEDULER_THREAD_NAME_PREFIX: "memcached-scheduler"
