apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: congen-ingress
  namespace: congen
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: congen.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8888
      - path: /auth/
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080 