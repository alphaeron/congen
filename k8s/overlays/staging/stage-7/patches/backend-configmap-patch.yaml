apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  PGSSLMODE: "true"
  SPRINGDOC_API_DOCS_ENABLED: "true"
  SPRINGDOC_SWAGGER_UI_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: "https://staging.congen.com,https://www.staging.congen.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Requested-With,Accept,Accept-Language,Cache-Control,If-Modified-Since,If-None-Match,Origin,Referer,User-Agent"
  CORS_EXPOSED_HEADERS: "Content-Length,Content-Range"
  CORS_MAX_AGE: "3600"
  # JWT Configuration for staging environment
  JWT_ISSUER_URI: "https://staging.congen.com/realms/congen"
  JWT_JWK_SET_URI: "http://keycloak:8080/realms/congen/protocol/openid-connect/certs"
  JWT_AUDIENCES: "congen-backend,account"
  CONGEN_KEYCLOAK_MANAGEMENT_URL: "http://keycloak:9000"
  # Memcached Configuration for staging
  MEMCACHED_HOST: "staging-memcached.congen.com"
  MEMCACHED_OP_TIMEOUT: "1000"
  MEMCACHED_MAX_QUEUED_NOREPLY: "1000"
  MEMCACHED_SCHEDULER_THREAD_POOL_SIZE: "15"
  MEMCACHED_SCHEDULER_QUEUE_CAPACITY: "1000"
  MEMCACHED_SCHEDULER_THREAD_NAME_PREFIX: "memcached-scheduler"
  MEMCACHED_USE_ELASTICACHE: "true"
  MEMCACHED_POLL_CONFIG_INTERVAL_MS: "60000"
 