apiVersion: v1
kind: Secret
metadata:
  name: congen-secret
  namespace: congen
type: Opaque
data:
  # Base64 encoded values - replace with actual staging database credentials
  # To encode: echo -n "your-username" | base64
  PGUSER: cG9zdGdyZXM=  # postgres (replace with actual staging username)
  PGPASSWORD: cG9zdGdyZXM=  # postgres (replace with actual staging password)
  PGDATABASE: cG9zdGdyZXM=  # postgres (replace with actual staging database) 