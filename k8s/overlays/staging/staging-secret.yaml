apiVersion: v1
kind: Secret
metadata:
  name: congen-secret
  namespace: congen
type: Opaque
data:
  # Base64 encoded values - replace with actual staging database credentials
  # To encode: echo -n "your-username" | base64
  PGUSER: cG9zdGdyZXM=  # postgres (replace with actual staging username)
  PGPASSWORD: cG9zdGdyZXM=  # postgres (replace with actual staging password)
  PGDATABASE: cG9zdGdyZXM=  # postgres (replace with actual staging database)
  DB_BASE_URL: amRiYzpwb3N0Z3Jlc3FsOi8v  # jdbc:postgresql://
  PGHOST: c3RhZ2luZy1kYi1ob3N0  # staging-db-host (replace with actual staging DB host)
  PGPORT: NTQzMg==  # 5432 (replace with actual staging port if different)
  KEYCLOAK_SERVICE_ACCOUNT_PASSWORD: <base64-encoded-staging-service-password>  # Replace with actual staging service account password 