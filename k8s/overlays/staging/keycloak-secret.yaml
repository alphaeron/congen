apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: congen
type: Opaque
data:
  # Base64 encoded values - replace with actual values before deployment
  KEYCLOAK_ADMIN: <base64-encoded-admin-username>
  KEYCLOAK_ADMIN_PASSWORD: <base64-encoded-admin-password>
  KEYCLOAK_DB_USERNAME: <base64-encoded-db-username>
  KEYCLOAK_DB_PASSWORD: <base64-encoded-db-password> 