apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: backend
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: congen-secret
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "local"
        - name: GDPR_AUDIT_ENABLED
          value: "false"
        - name: DATA_RETENTION_CHECK_ENABLED
          value: "false"
        - name: JVM_HEAP_MIN
          value: "384m"
        - name: JVM_HEAP_MAX
          value: "512m"
        - name: JVM_METASPACE_MIN
          value: "64M"
        - name: JVM_METASPACE_MAX
          value: "128M"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: "384Mi"
            cpu: "100m"
          limits:
            memory: "750Mi"
            cpu: "250m"
