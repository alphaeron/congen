apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: congen

resources:
- ../../base
- postgres-deployment.yaml
- postgres-service.yaml
- postgres-configmap.yaml
- postgres-pvc.yaml

patches:
- path: patches/network-policy-patch.yaml
  target:
    kind: NetworkPolicy
    name: congen-network-policy 