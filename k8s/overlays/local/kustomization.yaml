apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: congen

resources:
- ../../base
- postgres-deployment.yaml
- postgres-service.yaml
- postgres-configmap.yaml
- postgres-pvc.yaml
- local-secret.yaml
- keycloak-secret.yaml

patches:
- path: patches/migrations-configmap-patch.yaml
  target:
    kind: ConfigMap
    name: migrations-config
- path: patches/backend-deployment-patch.yaml
  target:
    kind: Deployment
    name: backend
- path: patches/backend-image-tag-patch.yaml
  target:
    kind: Deployment
    name: backend
- path: patches/frontend-image-tag-patch.yaml
  target:
    kind: Deployment
    name: frontend
- path: patches/backend-service-patch.yaml
  target:
    kind: Service
    name: backend
- path: patches/migration-service-labels-patch.yaml
  target:
    kind: Deployment
    name: migration-service 
- path: patches/keycloak-deployment-patch.yaml
  target:
    kind: Deployment
    name: keycloak 