apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: congen-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - congen.com
    secretName: congen-tls
  rules:
  - host: congen.com 