apiVersion: v1
kind: Secret
metadata:
  name: congen-secret
  namespace: congen
type: Opaque
data:
  # Base64 encoded values - replace with actual production database credentials
  # To encode: echo -n "your-username" | base64
  PGUSER: cG9zdGdyZXM=  # postgres (replace with actual production username)
  PGPASSWORD: cG9zdGdyZXM=  # postgres (replace with actual production password)
  PGDATABASE: cG9zdGdyZXM=  # postgres (replace with actual production database)
  DB_BASE_URL: amRiYzpwb3N0Z3Jlc3FsOi8v  # jdbc:postgresql://
  PGHOST: cHJvZC1kYi1ob3N0  # prod-db-host (replace with actual production DB host)
  PGPORT: NTQzMg==  # 5432 (replace with actual production port if different) 