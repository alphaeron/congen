apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: congen-hpa
  namespace: congen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 55
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60