apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: congen-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - congen.com
    secretName: congen-tls
  rules:
  - host: congen.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /auth/
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080 