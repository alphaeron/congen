apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  PGSSLMODE: "true"
  SPRINGDOC_API_DOCS_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  CORS_ALLOWED_ORIGINS: "https://congen.com,https://www.congen.com"
  # JWT Configuration for production environment
  JWT_ISSUER_URI: "http://congen.com:8080/realms/congen"
  JWT_JWK_SET_URI: "http://keycloak:8080/realms/congen/protocol/openid-connect/certs"
  JWT_AUDIENCES: "congen-backend"
  CONGEN_KEYCLOAK_MANAGEMENT_URL: "http://keycloak:9000"
  # Memcached Configuration for production
  MEMCACHED_HOST: "production-memcached.congen.com"
  MEMCACHED_OP_TIMEOUT: "1000"
  MEMCACHED_MAX_QUEUED_NOREPLY: "1000"
  MEMCACHED_SCHEDULER_THREAD_POOL_SIZE: "15"
  MEMCACHED_SCHEDULER_QUEUE_CAPACITY: "1000"
  MEMCACHED_SCHEDULER_THREAD_NAME_PREFIX: "memcached-scheduler"
  MEMCACHED_USE_ELASTICACHE: "true"
  MEMCACHED_POLL_CONFIG_INTERVAL_MS: "60000"
 