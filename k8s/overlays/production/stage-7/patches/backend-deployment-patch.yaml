apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "backend"
        vault.hashicorp.com/agent-inject-secret-database: "secret/data/congen/production/database"
        vault.hashicorp.com/agent-inject-template-database: |
          {{- with secret "secret/data/congen/production/database" -}}
          export PGUSER="{{ .Data.data.username }}"
          export PGPASSWORD="{{ .Data.data.password }}"
          export PGDATABASE="{{ .Data.data.database_name }}"
          export PGWRITERHOST="{{ .Data.data.writer_endpoint }}"
          export PGREADERHOST="{{ .Data.data.reader_endpoint }}"
          export PGPORT="{{ .Data.data.port }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-cache: "secret/data/congen/production/cache"
        vault.hashicorp.com/agent-inject-template-cache: |
          {{- with secret "secret/data/congen/production/cache" -}}
          export MEMCACHED_HOST="{{ .Data.data.configuration_endpoint }}"
          export MEMCACHED_PORT="{{ .Data.data.port }}"
          export MEMCACHED_USE_ELASTICACHE="{{ .Data.data.use_elasticache }}"
          {{- end }}
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-pre-populate-only: "false"
    spec:
      serviceAccountName: congen-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: GDPR_AUDIT_ENABLED
          value: "true"
        - name: DATA_RETENTION_CHECK_ENABLED
          value: "true"
        - name: JVM_HEAP_MIN
          value: "2048m"
        - name: JVM_HEAP_MAX
          value: "3072m"
        - name: JVM_METASPACE_MIN
          value: "256M"
        - name: JVM_METASPACE_MAX
          value: "512M"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
